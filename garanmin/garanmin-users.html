<!doctype html>
<!--
  GARANMIN — Kullanıcılar.

  ─── DETAY MODAL OLARAK ACILIYOR ──────────────────────────────────────────

  Ayri bir sayfa degil: geri donuldugunde arama kutusu bosalir, sayfa numarasi
  sifirlanir ve kullanici aradigi satiri yeniden bulmak zorunda kalirdi. Modal
  kapandiginda liste oldugu gibi duruyor.

  Liste SAYFALANIYOR ve arama SUNUCUDA yapiliyor: butun kullanicilari cekip
  tarayicida suzmek, kullanici sayisi buyudukce hem yavaslar hem de gereksiz yere
  butun e-posta adreslerini agdan gecirir.

  ─── TANIMLAR ONCE, ILK CAGRI EN SONDA ────────────────────────────────────

  Bir onceki surumde dosyanin ilk satiri `yukle()` cagiriyor, `const SAYFA = 25`
  ise iki satir SONRA geliyordu. `const` bildirimi yukari tasinir ama
  BASLATILANA KADAR erisilemez (temporal dead zone), dolayisiyla sayfa
  "Cannot access 'SAYFA' before initialization" ile bos kaliyordu. Sira korunmali.
-->
<html lang="tr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Garanmin — Kullanıcılar</title>
    <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="assets/adminator/adminator.css" />
    <link rel="stylesheet" href="assets/css/garanmin.css" />
  </head>

  <body>
    <div class="shell" id="g-app">
      <aside class="d-sidebar" id="garanmin-menu"></aside>

      <div class="main">
        <header class="d-topbar" id="garanmin-navbar"></header>

        <main class="content">
          <div id="garanmin-error"></div>
          <div class="kpi-grid" id="serit"></div>

          <div class="grid">
            <section class="card col-12">
              <div class="card-head">
                <div class="card-title-wrap">
                  <span class="eyebrow">Kayitli hesaplar</span>
                  <h2 class="card-title">Kullanıcı listesi</h2>
                </div>
                <div class="g-arac">
                  <input id="arama" class="input" placeholder="E-posta ara..." />
                  <button class="btn btn--primary btn--sm" id="ara-btn" title="Ara">Ara</button>
                  <button class="btn btn--ghost btn--sm" id="temizle-btn" title="Temizle">Temizle</button>
                </div>
              </div>

              <div class="g-tablo-kutu-esnek">
                <table class="table">
                  <!-- Sutun genislikleri SABIT (gerekce: garanmin.css). Toplam %100. -->
                  <colgroup>
                    <col style="width:34%"><col style="width:12%"><col style="width:13%">
                    <col style="width:9%"><col style="width:9%">
                    <col style="width:10%"><col style="width:9%"><col style="width:4%">
                  </colgroup>
                  <thead>
                    <tr>
                      <th>E-posta</th><th>Kayit</th><th>Son giris</th>
                      <th class="sayi">Cihaz</th><th class="sayi">Kredi</th>
                      <th class="sayi">Reklam</th><th class="sayi">Talep</th><th></th>
                    </tr>
                  </thead>
                  <tbody id="tbody"><tr><td colspan="8" class="soluk">Yukleniyor...</td></tr></tbody>
                </table>
              </div>

              <div class="form-actions" style="margin-top:14px;padding-top:14px">
                <span class="soluk" style="font-size:12px;color:var(--t-muted)" id="sayfa-bilgi"></span>
                <span class="spacer"></span>
                <button class="btn btn--ghost btn--sm" id="onceki">Onceki</button>
                <button class="btn btn--ghost btn--sm" id="sonraki">Sonraki</button>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script src="assets/js/garanmin-api.js"></script>
    <script>
      /* ── TANIMLAR ÖNCE ─────────────────────────────────────────────────── */

      const SAYFA = 25;
      let offset = 0, arama = '';

      /**
       * Kullanıcı detayini modal olarak acar.
       *
       * TEK CAGRI: profil, cihazlar, garanti dagilimi ve talepler
       * `garanmin_user_detail` icinden birlikte geliyor. Dort ayri cagri olsaydi
       * aralarinda gecen surede kullanici cihaz ekledi diye "toplam 13 ama listede
       * 12 satir" gibi bir ekran cikabilir ve bu fark hicbir yerde hata olarak
       * gorunmezdi.
       */
      async function detay(id, email) {
        garanminModalAc(
          '<div class="g-modal-kim">'
          + '<span class="avatar">' + gEsc((email || '?').slice(0, 2).toUpperCase()) + '</span>'
          + '<div><span class="eyebrow">Kullanıcı detayi</span>'
          + '<div class="modal-title">' + gEsc(email) + '</div></div></div>',
          '<div class="g-bos">' + gIkon('refresh') + '<span>Yukleniyor...</span></div>'
        );

        try {
          const v = await garanminData('garanmin_user_detail', { p_user_id: id });
          const p = v.profil, g = v.garanti || {}, c = v.cihazlar || [], t = v.talepler || [];

          const cihazHtml = c.length
            ? c.map(function (d) {
                const s = gDurum(gGarantiDurum(d.alim, d.bitis));
                return '<tr>'
                  + '<td title="' + gEsc(d.ad) + '">' + gEsc(d.ad) + '</td>'
                  + '<td title="' + gEsc(d.marka) + '">' + gEsc(d.marka) + '</td>'
                  + '<td>' + gEsc(gKategori(d.kategori)) + '</td>'
                  + '<td>' + gEsc(d.oda) + '</td>'
                  + '<td>' + gDate(d.alim) + '</td>'
                  + '<td>' + gDate(d.bitis) + '</td>'
                  + '<td><span class="badge ' + s.sinif + '">' + s.ad + '</span></td>'
                  + '<td>' + (d.fatura_var
                      ? '<span class="badge success">var</span>'
                      : '<span class="soluk">-</span>') + '</td>'
                  + '</tr>';
              }).join('')
            : '<tr><td colspan="8" class="soluk">Bu kullanicinin cihazi yok</td></tr>';

          document.getElementById('g-modal-govde').innerHTML =
            '<div class="kpi-grid" style="margin-bottom:0">'
            + gKpi([
                { etiket: 'Cihaz',          deger: gNum(c.length),  ikon: 'monitor', renk: 'primary' },
                { etiket: 'Kredi',          deger: gNum(p.credits), ikon: 'star',    renk: 'warning' },
                { etiket: 'Izlenen reklam', deger: gNum(p.ads),     ikon: 'tv',      renk: 'success' },
                { etiket: 'Destek talebi',  deger: gNum(t.length),  ikon: 'support', renk: 'danger' },
              ])
            + '</div>'
            + '<div class="grid">'
            +   '<div class="col-4" style="display: flex; flex-direction: column; gap: 14px; min-height: 0;">'
            +     '<section class="card" style="flex: none;">'
            +       '<div class="card-head"><div class="card-title-wrap">'
            +         '<span class="eyebrow">Hesap</span><h2 class="card-title">Profil</h2>'
            +       '</div></div>'
            +       '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">'
            +         gKv('Kayit', gDate(p.created_at))
            +         gKv('Son giris', gGoreli(p.last_sign_in_at))
            +         gKv('Yontem', gEsc(p.saglayici))
            +         gKv('Aktif', gNum(g.active || 0))
            +         gKv('Yakin', gNum(g.expiring_soon || 0))
            +         gKv('Dolmus', gNum(g.expired || 0))
            +       '</div>'
            +     '</section>'
            +     '<section class="card" style="flex: 1; min-height: 0;">'
            +       '<div class="card-head"><div class="card-title-wrap">'
            +         '<span class="eyebrow">Iletisim</span><h2 class="card-title">Destek talepleri</h2>'
            +       '</div></div>'
            +       '<div class="g-tablo-kutu-esnek">'
            +         '<table class="table">'
            +           '<colgroup>'
            +             '<col style="width:25%"><col style="width:25%">'
            +             '<col style="width:50%">'
            +           '</colgroup>'
            +           '<thead><tr>'
            +             '<th>Tarih</th><th>Tur/Durum</th><th>Mesaj</th>'
            +           '</tr></thead><tbody>' 
            +           (t.length ? t.map(function (x) {
                          return '<tr><td class="soluk">' + gDateTime(x.created_at) + '</td>'
                            + '<td>' + gEsc(x.kind) + '<br><span class="soluk" style="font-size:10px">' + gEsc(x.status) + '</span></td>'
                            + '<td class="metin">' + gEsc(x.message) + '</td></tr>';
                        }).join('') : '<tr><td colspan="3" class="soluk">Talep yok</td></tr>') 
            +           '</tbody></table>'
            +       '</div>'
            +     '</section>'
            +   '</div>'
            +   '<section class="card col-8">'
            +     '<div class="card-head">'
            +       '<div class="card-title-wrap">'
            +         '<span class="eyebrow">Kayitli</span><h2 class="card-title">Cihazlar</h2>'
            +       '</div>'
            +       '<div class="g-arac">'
            +         '<span class="badge success">' + gNum(g.active || 0) + ' aktif</span>'
            +         '<span class="badge warning">' + gNum(g.expiring_soon || 0) + ' yakin</span>'
            +         '<span class="badge danger">' + gNum(g.expired || 0) + ' dolmus</span>'
            +       '</div>'
            +     '</div>'
            +     '<div class="g-tablo-kutu-esnek">'
            +       '<table class="table">'
            +         '<colgroup>'
            +           '<col style="width:18%"><col style="width:12%"><col style="width:13%">'
            +           '<col style="width:11%"><col style="width:11%"><col style="width:11%">'
            +           '<col style="width:15%"><col style="width:9%">'
            +         '</colgroup>'
            +         '<thead><tr>'
            +           '<th>Cihaz</th><th>Marka</th><th>Kategori</th><th>Oda</th>'
            +           '<th>Alim</th><th>Bitis</th><th>Durum</th><th>Fatura</th>'
            +         '</tr></thead><tbody>' + cihazHtml + '</tbody></table>'
            +     '</div>'
            +   '</section>'
            + '</div>';
        } catch (e) {
          document.getElementById('g-modal-govde').innerHTML =
            '<div class="g-uyari danger" style="margin:0">' + gIkon('alert')
            + '<span>' + gEsc(e.message) + '</span></div>';
        }
      }

      async function yukle() {
        try {
          const v = await garanminData('garanmin_users_list', {
            p_limit: SAYFA, p_offset: offset, p_search: arama,
          });

          const tb = document.getElementById('tbody');
          if (!v.length) {
            tb.innerHTML = '<tr><td colspan="8" class="soluk">Kayit yok</td></tr>';
          } else {
            tb.innerHTML = v.map(function (u) {
              const eposta = gEsc(u.email || '-');
              return '<tr style="cursor:pointer" onclick="detay(\'' + gEsc(u.id) + '\',\'' + eposta + '\')">'
                /* `title`: sutun sabit genislikte oldugu icin uzun e-posta
                   kesiliyor; tam degere ustune gelince ulasilabilsin. */
                + '<td title="' + eposta + '">' + eposta + '</td>'
                + '<td class="soluk">' + gDate(u.created_at) + '</td>'
                + '<td class="soluk">' + gGoreli(u.last_sign_in_at) + '</td>'
                + '<td class="sayi">' + gNum(u.device_count) + '</td>'
                + '<td class="sayi">' + gNum(u.credits) + '</td>'
                + '<td class="sayi">' + gNum(u.ad_watch_count) + '</td>'
                + '<td class="sayi">' + gNum(u.ticket_count) + '</td>'
                + '<td class="soluk">&rsaquo;</td>'
                + '</tr>';
            }).join('');
          }

          document.getElementById('sayfa-bilgi').textContent =
            v.length ? (offset + 1) + '-' + (offset + v.length) + ' arasi gosteriliyor' : 'Kayit yok';

          /*
            "Sonraki" DONEN KAYIT SAYISINA gore kapaniyor. Toplam sayiyi ayrica
            sormak her sayfa cevirmede fazladan bir sorgu demek olurdu; sayfa
            dolmadiysa son sayfadayiz.
          */
          document.getElementById('sonraki').disabled = v.length < SAYFA;
          document.getElementById('onceki').disabled = offset === 0;
        } catch (e) { gError(e.message); }
      }

      async function seritYukle() {
        try {
          const s = await garanminData('garanmin_stats');
          gKpiYaz('serit', [
            { etiket: 'Toplam kullanici', deger: gNum(s.total_users),        ikon: 'users',     renk: 'primary' },
            { etiket: 'Gunluk aktif',     deger: gNum(s.dau),                ikon: 'run',       renk: 'success' },
            { etiket: 'Cihaz ekleyen',    deger: gNum(s.users_with_devices), ikon: 'userCheck', renk: 'warning' },
            { etiket: 'Yeni (7 gun)',     deger: gNum(s.new_users_7d),       ikon: 'userPlus',  renk: 'purple' },
          ]);
        } catch (e) { gError(e.message); }
      }

      document.getElementById('ara-btn').onclick = function () {
        arama = document.getElementById('arama').value.trim(); offset = 0; yukle();
      };
      document.getElementById('temizle-btn').onclick = function () {
        document.getElementById('arama').value = ''; arama = ''; offset = 0; yukle();
      };
      // Enter da aramayi tetiklesin; kullanici butonu aramak zorunda kalmasin.
      document.getElementById('arama').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') document.getElementById('ara-btn').click();
      });
      document.getElementById('onceki').onclick = function () {
        if (offset === 0) return;
            </section>
          </div>
        </main>
      </div>
    </div>

            { etiket: 'Gunluk aktif',     deger: gNum(s.dau),                ikon: 'run',       renk: 'success' },
            { etiket: 'Cihaz ekleyen',    deger: gNum(s.users_with_devices), ikon: 'userCheck', renk: 'warning' },
            { etiket: 'Yeni (7 gun)',     deger: gNum(s.new_users_7d),       ikon: 'userPlus',  renk: 'purple' },
          ]);
        } catch (e) { gError(e.message); }
      }

      document.getElementById('ara-btn').onclick = function () {
        arama = document.getElementById('arama').value.trim(); offset = 0; yukle();
      };
      document.getElementById('temizle-btn').onclick = function () {
        document.getElementById('arama').value = ''; arama = ''; offset = 0; yukle();
      };
      // Enter da aramayi tetiklesin; kullanici butonu aramak zorunda kalmasin.
      document.getElementById('arama').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') document.getElementById('ara-btn').click();
      });
      document.getElementById('onceki').onclick = function () {
        if (offset === 0) return;
        offset = Math.max(0, offset - SAYFA); yukle();
      };
      document.getElementById('sonraki').onclick = function () { offset += SAYFA; yukle(); };

      /* ── İLK ÇAĞRI EN SONDA (yukarıdaki nota bakın) ────────────────────── */
      if (garanminGuardPage()) {
        garanminShell('garanmin-users.html', 'Kullanıcı Listesi', 'Genel');
        seritYukle();
        yukle();
      }
    </script>
  </body>
</html>
