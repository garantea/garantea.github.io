<!doctype html>
<!--
  GARANMIN — Kullanicilar.

  ─── DUZELTILEN HATA ──────────────────────────────────────────────────────

  Onceki surumde sayfa hic acilmiyordu:

      Cannot access 'SAYFA' before initialization

  Sebep: dosyanin ilk satiri `yukle()` cagiriyordu, `const SAYFA = 25` ise iki satir
  SONRA geliyordu. `const` bildirimi yukari tasinir ama BASLATILANA KADAR erisilemez
  (temporal dead zone), dolayisiyla `yukle()` icindeki `SAYFA` referansi hemen hata
  firlatiyor ve sayfa bos kaliyordu. Artik butun tanimlar once, ILK CAGRI en sonda.

  ─── DETAY MODAL OLARAK ACILIYOR ──────────────────────────────────────────

  Ayri bir sayfa degil: geri donuldugunde arama kutusu bosalir, sayfa numarasi
  sifirlanir ve kullanici aradigi satiri yeniden bulmak zorunda kalirdi. Modal
  kapandiginda liste oldugu gibi duruyor.

  Liste SAYFALANIYOR ve arama SUNUCUDA yapiliyor: butun kullanicilari cekip
  tarayicida suzmek, kullanici sayisi buyudukce hem yavaslar hem de gereksiz yere
  butun e-posta adreslerini agdan gecirir.
-->
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Garanmin — Kullanicilar</title>
    <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/vendor/fonts/iconify-icons.css" />
    <link rel="stylesheet" href="assets/vendor/css/core.css" />
    <link rel="stylesheet" href="assets/css/garanmin.css" />
  </head>

  <body>
    <div class="g-app" id="g-app">
      <aside class="g-yan" id="garanmin-menu"></aside>
      <header class="g-ust" id="garanmin-navbar"></header>

      <main class="g-icerik">
        <div id="garanmin-error"></div>

        <div class="g-satir esit-4" id="serit"></div>

        <div class="g-kart" style="flex:1 1 auto;min-height:0">
          <div class="g-kart-bas" style="justify-content:space-between">
            <span><i class="bx bx-group"></i> Kullanici listesi</span>
            <span style="display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0">
              <input id="arama" class="form-control form-control-sm" style="width:230px"
                     placeholder="E-posta ara..." />
              <button class="btn btn-sm btn-primary" id="ara-btn" title="Ara"><i class="bx bx-search"></i></button>
              <button class="btn btn-sm btn-outline-secondary" id="temizle-btn" title="Temizle"><i class="bx bx-x"></i></button>
            </span>
          </div>

          <div class="g-kart-govde g-scroll">
            <table class="g-tablo">
              <thead>
                <tr>
                  <th>E-posta</th><th>Kayit</th><th>Son giris</th>
                  <th class="sayi">Cihaz</th><th class="sayi">Kredi</th>
                  <th class="sayi">Reklam</th><th class="sayi">Talep</th><th></th>
                </tr>
              </thead>
              <tbody id="tbody">
                <tr><td colspan="8" class="text-muted">Yukleniyor...</td></tr>
              </tbody>
            </table>
          </div>

          <div style="display:flex;align-items:center;gap:10px;padding-top:9px;flex:0 0 auto">
            <span class="text-muted" style="font-size:12px" id="sayfa-bilgi"></span>
            <span style="margin-left:auto;display:flex;gap:6px">
              <button class="btn btn-sm btn-outline-secondary" id="onceki"><i class="bx bx-chevron-left"></i></button>
              <button class="btn btn-sm btn-outline-secondary" id="sonraki"><i class="bx bx-chevron-right"></i></button>
            </span>
          </div>
        </div>
      </main>
    </div>

    <script src="assets/js/garanmin-api.js"></script>
    <script>
      /* ── TANIMLAR ÖNCE ─────────────────────────────────────────────────── */

      const SAYFA = 25;
      let offset = 0, arama = '';

      function kutu(liste) {
        document.getElementById('serit').innerHTML = liste.map(function (k) {
          return '<div class="g-kart"><div class="g-ozet">'
            + '<div class="g-ozet-ikon ' + k.renk + '"><i class="bx ' + k.ikon + '"></i></div>'
            + '<div style="min-width:0"><div class="g-ozet-sayi">' + k.deger + '</div>'
            + '<div class="g-ozet-etiket">' + k.etiket + '</div></div></div></div>';
        }).join('');
      }

      function kv(etiket, deger, not) {
        return '<div class="g-kv"><div class="g-kv-satir">'
          + '<span class="g-kv-etiket">' + etiket + '</span>'
          + '<span class="g-kv-deger">' + deger + '</span></div>'
          + (not ? '<div class="g-kv-not">' + not + '</div>' : '') + '</div>';
      }

      /**
       * Bir cihazin garanti durumu — uygulamanin kuralinin AYNISI.
       *
       * Esik "%90 tuketildi", "30 gun kaldi" DEGIL. Iki taraf farkli sayarsa panel,
       * kullanicinin telefonunda gordugunden baska bir tablo gosterir.
       */
      function durum(d) {
        if (!d.bitis) return 'active';
        const bitis = new Date(d.bitis), bugun = new Date();
        if (bitis < bugun) return 'expired';
        if (!d.alim) return 'active';
        const bas = new Date(d.alim), toplam = bitis - bas;
        if (toplam <= 0) return 'active';
        return ((bugun - bas) / toplam) > 0.9 ? 'expiring_soon' : 'active';
      }

      /**
       * Kullanici detayini modal olarak acar.
       *
       * TEK CAGRI: profil, cihazlar, garanti dagilimi ve talepler
       * `garanmin_user_detail` icinden birlikte geliyor. Dort ayri cagri olsaydi
       * aralarinda gecen surede kullanici cihaz ekledi diye "toplam 13 ama listede
       * 12 satir" gibi bir ekran cikabilir ve bu fark hicbir yerde hata olarak
       * gorunmezdi.
       */
      async function detay(id, email) {
        garanminModalAc(
          '<span class="g-avatar">' + gEsc((email || '?').slice(0, 2).toUpperCase()) + '</span>'
          + '<div><div style="font-size:14px">' + gEsc(email) + '</div>'
          + '<div style="font-size:11.5px;color:var(--g-soluk)">Kullanici detayi</div></div>',
          '<div class="g-bos"><i class="bx bx-loader-alt bx-spin" style="font-size:22px"></i></div>'
        );

        try {
          const v = await garanminData('garanmin_user_detail', { p_user_id: id });
          const p = v.profil, g = v.garanti || {}, c = v.cihazlar || [], t = v.talepler || [];

          const seritHtml = [
            { etiket: 'Cihaz',          deger: gNum(c.length),   ikon: 'bx-devices', renk: 'mavi' },
            { etiket: 'Kredi',          deger: gNum(p.credits),  ikon: 'bx-star',    renk: 'turuncu' },
            { etiket: 'Izlenen reklam', deger: gNum(p.ads),      ikon: 'bx-tv',      renk: 'yesil' },
            { etiket: 'Destek talebi',  deger: gNum(t.length),   ikon: 'bx-support', renk: 'kirmizi' },
          ].map(function (k) {
            return '<div class="g-kart"><div class="g-ozet">'
              + '<div class="g-ozet-ikon ' + k.renk + '"><i class="bx ' + k.ikon + '"></i></div>'
              + '<div><div class="g-ozet-sayi">' + k.deger + '</div>'
              + '<div class="g-ozet-etiket">' + k.etiket + '</div></div></div></div>';
          }).join('');

          const cihazHtml = c.length
            ? c.map(function (d) {
                const s = gDurum(durum(d));
                return '<tr>'
                  + '<td>' + gEsc(d.ad) + '</td>'
                  + '<td>' + gEsc(d.marka) + '</td>'
                  + '<td>' + gEsc(gKategori(d.kategori)) + '</td>'
                  + '<td>' + gEsc(d.oda) + '</td>'
                  + '<td>' + gDate(d.alim) + '</td>'
                  + '<td>' + gDate(d.bitis) + '</td>'
                  + '<td><span class="g-rozet ' + s.sinif + '">' + s.ad + '</span></td>'
                  + '<td>' + (d.fatura_var
                      ? '<i class="bx bx-check" style="color:var(--g-yesil)"></i>'
                      : '<span class="text-muted">-</span>') + '</td>'
                  + '</tr>';
              }).join('')
            : '<tr><td colspan="8" class="text-muted">Bu kullanicinin cihazi yok</td></tr>';

          const talepHtml = t.length
            ? t.map(function (x) {
                return '<tr><td>' + gDateTime(x.created_at) + '</td>'
                  + '<td>' + gEsc(x.kind) + '</td>'
                  + '<td>' + gEsc(x.status) + '</td>'
                  + '<td class="metin">' + gEsc(x.message) + '</td></tr>';
              }).join('')
            : '<tr><td colspan="4" class="text-muted">Talep yok</td></tr>';

          document.getElementById('g-modal-govde').innerHTML =
            '<div class="g-satir esit-4">' + seritHtml + '</div>'

            + '<div class="g-satir esit-3">'
            +   '<div class="g-kart">'
            +     '<div class="g-kart-bas"><i class="bx bx-id-card"></i> Profil</div>'
            +     '<div class="g-kart-govde">'
            +       kv('Kayit tarihi', gDate(p.created_at))
            +       kv('Son giris', gGoreli(p.last_sign_in_at))
            +       kv('Giris yontemi', gEsc(p.saglayici))
            +       kv('Aktif garanti', gNum(g.active || 0))
            +       kv('Yakinda bitiyor', gNum(g.expiring_soon || 0))
            +       kv('Suresi dolmus', gNum(g.expired || 0))
            +     '</div>'
            +   '</div>'

            +   '<div class="g-kart" style="grid-column: span 2">'
            +     '<div class="g-kart-bas" style="justify-content:space-between">'
            +       '<span><i class="bx bx-devices"></i> Cihazlar</span>'
            +       '<span style="text-transform:none;letter-spacing:0">'
            +         '<span class="g-rozet mavi">' + gNum(g.active || 0) + ' aktif</span> '
            +         '<span class="g-rozet turuncu">' + gNum(g.expiring_soon || 0) + ' yakin</span> '
            +         '<span class="g-rozet kirmizi">' + gNum(g.expired || 0) + ' dolmus</span>'
            +       '</span>'
            +     '</div>'
            /* Cihaz listesi kendi kutusunda kayiyor: 40 cihazi olan bir kullanicida
               modal ekrandan tasmasin, 2 cihazi olanda da bos yer kalmasin. */
            +     '<div class="g-kart-govde g-scroll" style="max-height:260px">'
            +       '<table class="g-tablo"><thead><tr>'
            +         '<th>Cihaz</th><th>Marka</th><th>Kategori</th><th>Oda</th>'
            +         '<th>Alim</th><th>Bitis</th><th>Durum</th><th>Fatura</th>'
            +       '</tr></thead><tbody>' + cihazHtml + '</tbody></table>'
            +     '</div>'
            +   '</div>'
            + '</div>'

            + '<div class="g-kart">'
            +   '<div class="g-kart-bas"><i class="bx bx-support"></i> Destek talepleri</div>'
            +   '<div class="g-kart-govde g-scroll" style="max-height:180px">'
            +     '<table class="g-tablo"><thead><tr>'
            +       '<th>Tarih</th><th>Tur</th><th>Durum</th><th>Mesaj</th>'
            +     '</tr></thead><tbody>' + talepHtml + '</tbody></table>'
            +   '</div>'
            + '</div>';
        } catch (e) {
          document.getElementById('g-modal-govde').innerHTML =
            '<div class="alert alert-danger mb-0">' + gEsc(e.message) + '</div>';
        }
      }

      async function yukle() {
        try {
          const v = await garanminData('garanmin_users_list', {
            p_limit: SAYFA, p_offset: offset, p_search: arama,
          });

          const tb = document.getElementById('tbody');
          if (!v.length) {
            tb.innerHTML = '<tr><td colspan="8" class="text-muted">Kayit yok</td></tr>';
          } else {
            tb.innerHTML = v.map(function (u) {
              const eposta = gEsc(u.email || '-');
              return '<tr class="tiklanir" onclick="detay(\'' + gEsc(u.id) + '\',\'' + eposta + '\')">'
                + '<td>' + eposta + '</td>'
                + '<td>' + gDate(u.created_at) + '</td>'
                + '<td>' + gGoreli(u.last_sign_in_at) + '</td>'
                + '<td class="sayi"><span class="g-rozet mavi">' + gNum(u.device_count) + '</span></td>'
                + '<td class="sayi">' + gNum(u.credits) + '</td>'
                + '<td class="sayi">' + gNum(u.ad_watch_count) + '</td>'
                + '<td class="sayi">' + gNum(u.ticket_count) + '</td>'
                + '<td class="text-muted"><i class="bx bx-chevron-right"></i></td>'
                + '</tr>';
            }).join('');
          }

          document.getElementById('sayfa-bilgi').textContent =
            v.length ? (offset + 1) + '-' + (offset + v.length) + ' arasi gosteriliyor' : 'Kayit yok';

          /*
            "Sonraki" DONEN KAYIT SAYISINA gore kapaniyor. Toplam sayiyi ayrica sormak
            her sayfa cevirmede fazladan bir sorgu demek olurdu; sayfa dolmadiysa son
            sayfadayiz.
          */
          document.getElementById('sonraki').disabled = v.length < SAYFA;
          document.getElementById('onceki').disabled = offset === 0;
        } catch (e) { gError(e.message); }
      }

      async function seritYukle() {
        try {
          const s = await garanminData('garanmin_stats');
          kutu([
            { etiket: 'Toplam kullanici', deger: gNum(s.total_users),        ikon: 'bx-group',      renk: 'mavi' },
            { etiket: 'Gunluk aktif',     deger: gNum(s.dau),                ikon: 'bx-run',        renk: 'yesil' },
            { etiket: 'Cihaz ekleyen',    deger: gNum(s.users_with_devices), ikon: 'bx-user-check', renk: 'turuncu' },
            { etiket: 'Yeni (7 gun)',     deger: gNum(s.new_users_7d),       ikon: 'bx-user-plus',  renk: 'mor' },
          ]);
        } catch (e) { gError(e.message); }
      }

      document.getElementById('ara-btn').onclick = function () {
        arama = document.getElementById('arama').value.trim(); offset = 0; yukle();
      };
      document.getElementById('temizle-btn').onclick = function () {
        document.getElementById('arama').value = ''; arama = ''; offset = 0; yukle();
      };
      // Enter da aramayi tetiklesin; kullanici butonu aramak zorunda kalmasin.
      document.getElementById('arama').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') document.getElementById('ara-btn').click();
      });
      document.getElementById('onceki').onclick = function () {
        if (offset === 0) return;
        offset = Math.max(0, offset - SAYFA); yukle();
      };
      document.getElementById('sonraki').onclick = function () { offset += SAYFA; yukle(); };

      /* ── İLK ÇAĞRI EN SONDA (yukarıdaki hata notuna bakın) ─────────────── */
      if (garanminGuardPage()) {
        garanminShell('garanmin-users.html', 'Kullanicilar');
        seritYukle();
        yukle();
      }
    </script>
  </body>
</html>
