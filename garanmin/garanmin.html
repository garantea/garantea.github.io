<!doctype html>
<!--
  GARANMIN — giris.

  Bu sayfa herkese acik bir adreste duruyor ve bunu gizlemeye calismiyor. Kapi
  istemcide degil SUNUCUDA: `garanmin_login` parolayi bcrypt ile dogruluyor, basarisiz
  denemeler arttikca cevabi geciktiriyor ve basarili giriste 8 saat omurlu bir jeton
  donuyor. Sayfanin kaynagini gormek hicbir sey kazandirmiyor.
-->
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Garanmin — Giris</title>
    <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/vendor/fonts/iconify-icons.css" />
    <link rel="stylesheet" href="assets/vendor/css/core.css" />
    <link rel="stylesheet" href="assets/css/garanmin.css" />
  </head>

  <body>
    <div class="g-giris">
      <div class="g-giris-kutu">
        <div id="logo-yuva"></div>

        <div style="font-size:26px;font-weight:800;letter-spacing:-.6px;margin-top:6px">
          <span style="color:#2563eb">Garan</span><span style="color:#dc2626">min</span>
        </div>
        <div style="color:#6b7280;font-size:13px;margin-bottom:22px">GaranTea yonetim paneli</div>

        <div id="hata" style="display:none" class="alert alert-danger py-2 text-start small"></div>

        <form id="form" autocomplete="off">
          <div class="mb-3 text-start">
            <label class="form-label small fw-semibold">Kullanici adi</label>
            <input class="form-control" id="kullanici" autocomplete="username" required autofocus />
          </div>
          <div class="mb-3 text-start">
            <label class="form-label small fw-semibold">Parola</label>
            <input class="form-control" id="parola" type="password" autocomplete="current-password" required />
          </div>
          <button class="btn btn-primary w-100" id="btn" type="submit">
            <i class="bx bx-log-in me-1"></i> Giris yap
          </button>
        </form>

        <div style="color:#9aa1b2;font-size:11px;margin-top:18px;line-height:1.5">
          Oturum sekme kapaninca sona erer.<br>Basarisiz denemeler kademeli olarak yavaslatilir.
        </div>
      </div>
    </div>

    <script src="assets/js/garanmin-api.js"></script>
    <script>
      document.getElementById('logo-yuva').innerHTML =
        GARANMIN_LOGO.replace('class="g-logo"', 'class="g-logo g-giris-logo"');

      // Oturum zaten acıksa girişi tekrar sormanın anlamı yok.
      if (garanminToken()) location.href = 'garanmin-dashboard.html';

      const form = document.getElementById('form');
      const btn  = document.getElementById('btn');
      const hata = document.getElementById('hata');

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        hata.style.display = 'none';

        /*
          BUTON KILITLENIYOR. Sunucu basarisiz denemelerde kasitli olarak bekliyor
          (kaba kuvvete karsi); o sirada kullanici sabirsizlanip tekrar tiklarsa
          ikinci bir deneme daha sayaca eklenir ve bekleme kendi kendini uzatirdi.
        */
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Kontrol ediliyor...';

        try {
          const s = await garanminRpc('garanmin_login', {
            p_user: document.getElementById('kullanici').value.trim(),
            p_pass: document.getElementById('parola').value,
          });
          garanminSetSession(s);
          location.href = 'garanmin-dashboard.html';
        } catch (err) {
          hata.textContent = err.message;
          hata.style.display = 'block';
          document.getElementById('parola').value = '';
          btn.disabled = false;
          btn.innerHTML = '<i class="bx bx-log-in me-1"></i> Giris yap';
        }
      });
    </script>
  </body>
</html>
