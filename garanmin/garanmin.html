<!doctype html>
<!--
  GARANMIN — giris.

  Bu sayfa herkese acik bir adreste duruyor ve bunu gizlemeye calismiyor. Kapi
  istemcide degil SUNUCUDA: `garanmin_login` parolayi bcrypt ile dogruluyor,
  basarisiz denemeler arttikca cevabi geciktiriyor ve basarili giriste 8 saat
  omurlu bir jeton donuyor. Sayfanin kaynagini gormek hicbir sey kazandirmiyor.

  ARAYUZ: puikinsh/Adminator sablonunun `.auth-shell` duzeni — solda degradeli
  tanitim paneli, sagda form.
-->
<html lang="tr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Garanmin — Giris</title>
    <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="assets/adminator/adminator.css" />
    <link rel="stylesheet" href="assets/css/garanmin.css" />
  </head>

  <body>
    <!-- Tüm arkaplan için animasyonlu ve daha soft renkli gradyan -->
    <div class="auth-shell" style="background: linear-gradient(270deg, #dbeafe, #bfdbfe, #93c5fd, #a5b4fc, #fecdd3, #fda4af); background-size: 400% 400%; animation: GaranminGradient 15s ease infinite;">
      
      <!-- Tek sütun: form ortalanmış -->
      <main class="auth-main" style="width: 100%; background: transparent; display: flex; align-items: center; justify-content: center;">
        
        <!-- Giriş Kutusu (Glassmorphism efekti) -->
        <div class="g-giris-kutu" style="background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border-radius: 20px; padding: 40px 32px; box-shadow: 0 8px 32px rgba(0,0,0,0.05); text-align: center; border: 1px solid rgba(255,255,255,0.4);">
          
          <!-- BÜYÜK LOGO -->
          <div id="logo-yuva" style="width: 140px; height: 140px; margin: 0 auto 16px;"></div>
          
          <h1 style="font-family:'Inter Tight',sans-serif;font-size:32px;font-weight:700;letter-spacing:-.025em;margin:0 0 6px">
            <span style="color:var(--primary)">Garan</span><span style="color:var(--danger)">min</span>
          </h1>
          <p style="color:var(--t-muted);font-size:14px;margin:0 0 32px">
            Yönetim paneline giriş yapın
          </p>

          <div id="hata" style="display:none; text-align: left;"></div>

          <form id="form" class="g-giris-form" autocomplete="off" style="text-align: left;">
            <div>
              <label for="kullanici">Kullanıcı adı</label>
              <input id="kullanici" autocomplete="username" required autofocus style="background: rgba(255,255,255,0.8);" />
            </div>
            <div>
              <label for="parola">Parola</label>
              <input id="parola" type="password" autocomplete="current-password" required style="background: rgba(255,255,255,0.8);" />
            </div>
            <button class="btn btn--primary" id="btn" type="submit"
                    style="justify-content:center;margin-top:12px;padding:12px 14px; font-weight: 600;">
              <span id="btn-yazi">Giriş yap</span>
            </button>
          </form>

          <div class="g-giris-not" style="margin-top: 24px;">
            Oturum sekme kapanınca sona erer.<br>
            Başarısız denemeler kademeli olarak yavaşlatılır.
          </div>
        </div>
      </main>
    </div>

    <script src="assets/js/garanmin-api.js"></script>
    <script>
      document.getElementById('logo-yuva').innerHTML =
        GARANMIN_LOGO.replace('class="g-logo"', 'class="g-logo g-giris-logo"');

      // Oturum zaten acıksa girişi tekrar sormanın anlamı yok.
      if (garanminToken()) location.href = 'garanmin-dashboard.html';

      const form = document.getElementById('form');
      const btn  = document.getElementById('btn');
      const hata = document.getElementById('hata');

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        hata.style.display = 'none';

        /*
          BUTON KILITLENIYOR. Sunucu basarisiz denemelerde kasitli olarak bekliyor
          (kaba kuvvete karsi); o sirada kullanici sabirsizlanip tekrar tiklarsa
          ikinci bir deneme daha sayaca eklenir ve bekleme kendi kendini uzatirdi.
        */
        btn.disabled = true;
        document.getElementById('btn-yazi').textContent = 'Kontrol ediliyor...';

        try {
          const s = await garanminRpc('garanmin_login', {
            p_user: document.getElementById('kullanici').value.trim(),
            p_pass: document.getElementById('parola').value,
          });
          garanminSetSession(s);
          location.href = 'garanmin-dashboard.html';
        } catch (err) {
          hata.innerHTML = '<div class="g-uyari danger" style="margin-bottom:0">'
            + gIkon('alert') + '<span>' + gEsc(err.message) + '</span></div>';
          hata.style.display = 'block';
          document.getElementById('parola').value = '';
          btn.disabled = false;
          document.getElementById('btn-yazi').textContent = 'Giriş yap';
        }
      });
    </script>
  </body>
</html>
