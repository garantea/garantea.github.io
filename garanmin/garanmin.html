<!doctype html>
<!--
  GARANMIN — giris sayfasi.

  Parola SUNUCUDA dogrulaniyor: `garanmin_login` fonksiyonu bcrypt karsilastirmasini
  Postgres icinde yapiyor ve basarili olursa 8 saatlik bir oturum jetonu donduruyor.
  Tarayicida hicbir parola ya da hash saklanmiyor — yalnizca jeton, o da sekme
  kapaninca silinen `sessionStorage`ta.
-->
<html lang="tr" class="layout-menu-fixed layout-compact" data-assets-path="assets/" data-template="vertical-menu-template-free">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Garanmin — Giris</title>
    <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/vendor/fonts/iconify-icons.css" />
    <link rel="stylesheet" href="assets/vendor/css/core.css" />
    <link rel="stylesheet" href="assets/css/demo.css" />
    <link rel="stylesheet" href="assets/vendor/css/pages/page-auth.css" />
    <script src="assets/vendor/js/helpers.js"></script>
    <script src="assets/js/config.js"></script>
  </head>

  <body>
    <div class="container-xxl">
      <div class="authentication-wrapper authentication-basic container-p-y">
        <div class="authentication-inner">
          <div class="card px-sm-6 px-0">
            <div class="card-body">
              <div class="app-brand justify-content-center mb-6">
                <span class="app-brand-text demo text-heading fw-bold" style="font-size:1.75rem;letter-spacing:-1px">
                  <span style="color:#2563eb">Garan</span><span style="color:#dc2626">min</span>
                </span>
              </div>
              <p class="mb-5 text-center text-muted">GaranTea yonetim paneli</p>

              <div id="garanmin-error"></div>

              <form id="login-form" class="mb-3">
                <div class="mb-6">
                  <label for="username" class="form-label">Kullanici adi</label>
                  <input type="text" class="form-control" id="username" name="username"
                         autocomplete="username" autofocus required />
                </div>
                <div class="mb-6 form-password-toggle">
                  <label class="form-label" for="password">Parola</label>
                  <div class="input-group input-group-merge">
                    <input type="password" id="password" class="form-control" name="password"
                           placeholder="&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;"
                           autocomplete="current-password" required />
                    <span class="input-group-text cursor-pointer" id="toggle-pass">
                      <i class="bx bx-hide"></i>
                    </span>
                  </div>
                </div>
                <button class="btn btn-primary d-grid w-100" type="submit" id="submit-btn">Giris yap</button>
              </form>

              <p class="text-center text-muted small mb-0">
                Bu panel yalnizca yetkili kullanim icindir.
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="assets/vendor/libs/jquery/jquery.js"></script>
    <script src="assets/vendor/libs/popper/popper.js"></script>
    <script src="assets/vendor/js/bootstrap.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/garanmin-api.js"></script>

    <script>
      /*
        ZATEN GIRIS YAPILMISSA panele geciliyor. Jeton gecersizse ilk veri cagrisi
        kullaniciyi buraya geri gonderiyor; burada ayrica dogrulamak, her acilista
        gereksiz bir sunucu turu demek olurdu.
      */
      if (garanminToken()) location.href = 'garanmin-dashboard.html';

      document.getElementById('toggle-pass').addEventListener('click', function () {
        const i = document.getElementById('password');
        const ikon = this.querySelector('i');
        const gizli = i.type === 'password';
        i.type = gizli ? 'text' : 'password';
        ikon.className = gizli ? 'bx bx-show' : 'bx bx-hide';
      });

      document.getElementById('login-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        document.getElementById('garanmin-error').innerHTML = '';

        /*
          BUTON KILITLENIYOR. Kilitlenmeseydi arka arkaya basmak birden fazla giris
          denemesi uretir ve sunucudaki kaba kuvvet sayacini kullanicinin KENDISI
          doldururdu — dogru parolayla bile 5 dakika kilitlenirdi.
        */
        btn.disabled = true;
        btn.textContent = 'Kontrol ediliyor...';

        try {
          const sonuc = await garanminRpc('garanmin_login', {
            p_user: document.getElementById('username').value.trim(),
            p_pass: document.getElementById('password').value,
          });
          garanminSetToken(sonuc.token);
          location.href = 'garanmin-dashboard.html';
        } catch (err) {
          gError(err.message);
          btn.disabled = false;
          btn.textContent = 'Giris yap';
          document.getElementById('password').value = '';
        }
      });
    </script>
  </body>
</html>
