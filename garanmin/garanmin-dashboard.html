<!doctype html>
<!--
  GARANMIN — Genel Bakis (Ozet).

  ─── BU SAYFA NEYE ODAKLI ─────────────────────────────────────────────────

  Agirlik VERITABANINDA. Ustteki serit dogrudan tablo satir sayilarini ve veritabani
  boyutunu gosteriyor; "kac kullanici" gibi is metrikleri bunun altinda. Sebep: panelin
  ilk isi sistemin saglikli oldugunu soylemek; is metrikleri ancak veri akiyorsa anlamli.

  HER SAYI SUNUCUDAN. Sabit ("mock") veri YOK — sablonun ornek sayfalarinda gomulu
  rakamlar vardi ve birakilsaydi bos bir veritabaninda bile dolu bir panel gorunur,
  sorun oldugunda kimse fark etmezdi.
-->
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Garanmin — Genel Bakis</title>
    <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/vendor/fonts/iconify-icons.css" />
    <link rel="stylesheet" href="assets/vendor/css/core.css" />
    <link rel="stylesheet" href="assets/css/garanmin.css" />
  </head>

  <body>
    <div class="g-app" id="g-app">
      <aside class="g-yan" id="garanmin-menu"></aside>
      <header class="g-ust" id="garanmin-navbar"></header>

      <main class="g-icerik">
        <div id="garanmin-error"></div>

        <!-- VERITABANI SERIDI -->
        <div class="g-satir esit-4" id="db-serit"></div>

        <!-- IS METRIKLERI -->
        <div class="g-satir esit-4" id="is-serit"></div>

        <div class="g-satir esit-3 buyuk">
          <div class="g-kart" style="grid-column: span 2">
            <div class="g-kart-bas"><i class="bx bx-line-chart"></i> Son 30 gun — kullanici, cihaz, destek</div>
            <div class="g-kart-govde" id="c-akis"></div>
          </div>
          <div class="g-kart">
            <div class="g-kart-bas"><i class="bx bx-shield-quarter"></i> Garanti durumu</div>
            <div class="g-kart-govde" id="c-garanti"></div>
          </div>
        </div>

        <div class="g-satir esit-3 grafik">
          <div class="g-kart">
            <div class="g-kart-bas"><i class="bx bx-category"></i> Kategoriler</div>
            <div class="g-kart-govde" id="c-kategori"></div>
          </div>
          <div class="g-kart">
            <div class="g-kart-bas"><i class="bx bx-purchase-tag"></i> Markalar</div>
            <div class="g-kart-govde" id="c-marka"></div>
          </div>
          <div class="g-kart">
            <div class="g-kart-bas"><i class="bx bx-time-five"></i> Son eklenen cihazlar</div>
            <div class="g-kart-govde g-scroll">
              <table class="g-tablo">
                <thead><tr><th>Cihaz</th><th>Marka</th><th>Kullanici</th></tr></thead>
                <tbody id="son-cihaz"><tr><td colspan="3" class="text-muted">Yukleniyor...</td></tr></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="assets/vendor/libs/apex-charts/apexcharts.js"></script>
    <script src="assets/js/garanmin-api.js"></script>
    <script>
      if (garanminGuardPage()) {
        garanminShell('garanmin-dashboard.html', 'Genel Bakis');
        yukle();
      }

      function kutu(hedef, liste) {
        document.getElementById(hedef).innerHTML = liste.map(function (k) {
          return '<div class="g-kart"><div class="g-ozet">'
            + '<div class="g-ozet-ikon ' + k.renk + '"><i class="bx ' + k.ikon + '"></i></div>'
            + '<div><div class="g-ozet-sayi">' + k.deger + '</div>'
            + '<div class="g-ozet-etiket">' + k.etiket + '</div></div>'
            + '</div></div>';
        }).join('');
      }

      async function yukle() {
        try {
          /*
            HEPSI PARALEL. Siraya dizilseydi alti ayri gidis-donus ust uste binerdi;
            `Promise.all` ile toplam sure en yavas cagri kadar oluyor.
          */
          const [stats, tablolar, saglik, akis, garanti, kategori, marka, son] = await Promise.all([
            garanminData('garanmin_stats'),
            garanminData('garanmin_db_tables'),
            garanminData('garanmin_health'),
            garanminData('garanmin_akis', { p_gun: 30 }),
            garanminData('garanmin_warranty_stats'),
            garanminData('garanmin_device_categories'),
            garanminData('garanmin_device_brands'),
            garanminData('garanmin_recent_devices', { p_limit: 20 }),
          ]);

          const satir = tablolar.reduce(function (t, x) { return t + Number(x.satir); }, 0);

          kutu('db-serit', [
            { etiket: 'Veritabani boyutu', deger: saglik.db_size_text, ikon: 'bx-data',     renk: 'mor' },
            { etiket: 'Toplam satir',      deger: gNum(satir),         ikon: 'bx-table',    renk: 'mavi' },
            { etiket: 'Tablo',             deger: tablolar.length,     ikon: 'bx-layer',    renk: 'yesil' },
            { etiket: 'Cihaz kaydi',       deger: gNum(stats.total_devices), ikon: 'bx-devices', renk: 'turuncu' },
          ]);

          kutu('is-serit', [
            { etiket: 'Kullanici',        deger: gNum(stats.total_users),          ikon: 'bx-group',      renk: 'mavi' },
            { etiket: 'Aylik aktif',      deger: gNum(stats.mau),                  ikon: 'bx-pulse',      renk: 'yesil' },
            { etiket: 'Toplam kredi',     deger: gNum(stats.total_credits_sum),    ikon: 'bx-star',       renk: 'turuncu' },
            { etiket: 'Destek talebi',    deger: gNum(stats.support_tickets_total),ikon: 'bx-support',    renk: 'kirmizi' },
          ]);

          cizAkis(akis);
          cizGaranti(garanti);
          cizKategori(kategori);
          cizMarka(marka);
          sonCihaz(son);
        } catch (e) { gError(e.message); }
      }

      function cizAkis(v) {
        if (gBos('c-akis', v)) return;
        const t = gGrafikTemel();
        t.chart.type = 'area';
        new ApexCharts(document.getElementById('c-akis'), Object.assign(t, {
          series: [
            { name: 'Kullanici', data: v.map(function (d) { return Number(d.kullanici); }) },
            { name: 'Cihaz',     data: v.map(function (d) { return Number(d.cihaz); }) },
            { name: 'Destek',    data: v.map(function (d) { return Number(d.talep); }) },
          ],
          xaxis: { categories: v.map(function (d) { return gDate(d.gun); }),
                   labels: { rotate: 0, hideOverlappingLabels: true } },
          stroke: { curve: 'smooth', width: 2 },
          fill: { type: 'gradient', gradient: { opacityFrom: .35, opacityTo: .02 } },
          colors: [G_RENK[0], G_RENK[1], G_RENK[3]],
          legend: { position: 'top', horizontalAlign: 'right' },
        })).render();
      }

      function cizGaranti(v) {
        if (gBos('c-garanti', v)) return;
        const t = gGrafikTemel();
        t.chart.type = 'donut';
        new ApexCharts(document.getElementById('c-garanti'), Object.assign(t, {
          series: v.map(function (d) { return Number(d.count); }),
          labels: v.map(function (d) { return gDurum(d.status).ad; }),
          colors: v.map(function (d) { return gDurum(d.status).renk; }),
          legend: { position: 'bottom' },
          plotOptions: { pie: { donut: { size: '62%' } } },
        })).render();
      }

      function cizKategori(v) {
        if (gBos('c-kategori', v)) return;
        const t = gGrafikTemel();
        t.chart.type = 'bar';
        new ApexCharts(document.getElementById('c-kategori'), Object.assign(t, {
          series: [{ name: 'Cihaz', data: v.map(function (d) { return Number(d.count); }) }],
          xaxis: { categories: v.map(function (d) { return gKategori(d.category); }) },
          plotOptions: { bar: { borderRadius: 5, distributed: true, columnWidth: '55%' } },
          legend: { show: false },
          colors: G_RENK,
        })).render();
      }

      function cizMarka(v) {
        if (gBos('c-marka', v)) return;
        const t = gGrafikTemel();
        t.chart.type = 'bar';
        new ApexCharts(document.getElementById('c-marka'), Object.assign(t, {
          series: [{ name: 'Cihaz', data: v.map(function (d) { return Number(d.count); }) }],
          xaxis: { categories: v.map(function (d) { return d.brand; }) },
          plotOptions: { bar: { horizontal: true, borderRadius: 5, barHeight: '62%' } },
          colors: [G_RENK[2]],
        })).render();
      }

      function sonCihaz(v) {
        const tb = document.getElementById('son-cihaz');
        if (!v || !v.length) {
          tb.innerHTML = '<tr><td colspan="3" class="text-muted">Kayit yok</td></tr>';
          return;
        }
        // Kullanici verisi `gEsc` ile kaciriliyor (gerekce: garanmin-api.js).
        tb.innerHTML = v.map(function (d) {
          return '<tr><td>' + gEsc(d.name) + '</td>'
            + '<td>' + gEsc(d.brand) + '</td>'
            + '<td class="text-muted">' + gEsc(d.email || '-') + '</td></tr>';
        }).join('');
      }
    </script>
  </body>
</html>
