<!doctype html>
<!--
  GARANMIN — Genel Bakis (Özet).

  ─── BU SAYFA NEYE ODAKLI ─────────────────────────────────────────────────

  Agirlik VERITABANINDA. Ustteki serit dogrudan tablo satir sayilarini ve
  veritabanı boyutunu gosteriyor; "kac kullanici" gibi is metrikleri bunun
  altinda. Sebep: panelin ilk isi sistemin saglikli oldugunu soylemek; is
  metrikleri ancak veri akiyorsa anlamli.

  HER SAYI SUNUCUDAN. Sabit ("mock") veri YOK — sablonun ornek sayfalarinda
  gomulu rakamlar vardi ve birakilsaydi bos bir veritabanında bile dolu bir panel
  gorunur, sorun oldugunda kimse fark etmezdi.

  ARAYUZ: puikinsh/Adminator sablonu (assets/adminator/adminator.css, MIT).
  Sinif adlari sablonun kendi adlari — `.shell`, `.d-sidebar`, `.card`,
  `.kpi-grid`, `.grid`, `.col-*`.
-->
<html lang="tr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Garanmin — Genel Bakis</title>
    <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="assets/adminator/adminator.css" />
    <link rel="stylesheet" href="assets/css/garanmin.css" />
  </head>

  <body>
    <div class="shell" id="g-app">
      <aside class="d-sidebar" id="garanmin-menu"></aside>

      <div class="main">
        <header class="d-topbar" id="garanmin-navbar"></header>

        <main class="content">
          <div id="garanmin-error"></div>

          <!-- KPI SERIDI (8 Kutu Tek Satir) -->
          <div class="kpi-grid" id="kpi-serit"></div>

          <div class="grid">
            <!-- UST SATIR (Yari Yariya) -->
            <section class="card col-6">
              <div class="card-head">
                <div class="card-title-wrap">
                  <span class="eyebrow">Son 30 gün</span>
                  <h2 class="card-title">Kayıt akışı</h2>
                </div>
                <span class="badge">kullanici · cihaz · destek</span>
              </div>
              <div class="g-grafik" id="c-akis"></div>
            </section>

            <section class="card col-6">
              <div class="card-head">
                <div class="card-title-wrap">
                  <span class="eyebrow">Canli</span>
                  <h2 class="card-title">Son eklenen cihazlar</h2>
                </div>
              </div>
              <div class="g-tablo-kutu-esnek">
                <table class="table">
                  <!-- Sutun genislikleri SABIT (gerekce: garanmin.css). Toplam %100. -->
                  <colgroup><col style="width:40%"><col style="width:24%"><col style="width:36%"></colgroup>
                  <thead><tr><th>Cihaz</th><th>Marka</th><th>Kullanıcı</th></tr></thead>
                  <tbody id="son-cihaz"><tr><td colspan="3" class="soluk">Yukleniyor...</td></tr></tbody>
                </table>
              </div>
            </section>

            <!-- ALT SATIR (Uclu Dagilim) -->
            <section class="card col-4">
              <div class="card-head">
                <div class="card-title-wrap">
                  <span class="eyebrow">Kirilim</span>
                  <h2 class="card-title">Kategoriler</h2>
                </div>
              </div>
              <div class="g-grafik" id="c-kategori"></div>
            </section>

            <section class="card col-4">
              <div class="card-head">
                <div class="card-title-wrap">
                  <span class="eyebrow">Kirilim</span>
                  <h2 class="card-title">Markalar</h2>
                </div>
              </div>
              <div class="g-grafik" id="c-marka"></div>
            </section>

            <section class="card col-4">
              <div class="card-head">
                <div class="card-title-wrap">
                  <span class="eyebrow">Cihazlar</span>
                  <h2 class="card-title">Garanti durumu</h2>
                </div>
              </div>
              <div class="g-grafik" id="c-garanti"></div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script src="assets/vendor/libs/apex-charts/apexcharts.js"></script>
    <script src="assets/js/garanmin-api.js"></script>
    <script>
      async function yukle() {
        try {
          /*
            HEPSI PARALEL. Siraya dizilseydi sekiz ayri gidis-donus ust uste
            binerdi; `Promise.all` ile toplam sure en yavas cagri kadar oluyor.
          */
          const [stats, tablolar, saglik, akis, garanti, kategori, marka, son] = await Promise.all([
            garanminData('garanmin_stats'),
            garanminData('garanmin_db_tables'),
            garanminData('garanmin_health'),
            garanminData('garanmin_akis', { p_gun: 30 }),
            garanminData('garanmin_warranty_stats'),
            garanminData('garanmin_device_categories'),
            garanminData('garanmin_device_brands'),
            garanminData('garanmin_recent_devices', { p_limit: 20 }),
          ]);

          const satir = tablolar.reduce(function (t, x) { return t + Number(x.satir); }, 0);

          gKpiYaz('kpi-serit', [
            { etiket: 'Veritabanı boyutu', deger: saglik.db_size_text, ikon: 'database', renk: 'purple' },
            { etiket: 'Toplam satir',      deger: gNum(satir),         ikon: 'list',     renk: 'primary' },
            { etiket: 'Tablo',             deger: tablolar.length,     ikon: 'layers',   renk: 'info' },
            { etiket: 'Cihaz kaydi',       deger: gNum(stats.total_devices), ikon: 'monitor', renk: 'success' },
            { etiket: 'Kullanıcı',     deger: gNum(stats.total_users),           ikon: 'users',   renk: 'primary' },
            { etiket: 'Aylık aktif',   deger: gNum(stats.mau),                   ikon: 'activity',renk: 'success' },
            { etiket: 'Toplam kredi',  deger: gNum(stats.total_credits_sum),     ikon: 'star',    renk: 'warning' },
            { etiket: 'Destek talebi', deger: gNum(stats.support_tickets_total), ikon: 'support', renk: 'danger' },
          ]);

          cizAkis(akis);
          cizGaranti(garanti);
          cizKategori(kategori);
          cizMarka(marka);
          sonCihaz(son);
        } catch (e) { gError(e.message); }
      }

      function cizAkis(v) {
        if (gBos('c-akis', v)) return;
        const t = gGrafikTemel();
        t.chart.type = 'area';
        new ApexCharts(gKap('c-akis'), Object.assign(t, {
          series: [
            { name: 'Kullanıcı', data: v.map(function (d) { return Number(d.kullanici); }) },
            { name: 'Cihaz',     data: v.map(function (d) { return Number(d.cihaz); }) },
            { name: 'Destek',    data: v.map(function (d) { return Number(d.talep); }) },
          ],
          xaxis: { categories: v.map(function (d) { return gDate(d.gun); }),
                   labels: { rotate: 0, hideOverlappingLabels: true } },
          stroke: { curve: 'smooth', width: 2 },
          fill: { type: 'gradient', gradient: { opacityFrom: .28, opacityTo: .02 } },
          colors: [G_RENK[0], G_RENK[1], G_RENK[3]],
          legend: { position: 'top', horizontalAlign: 'right' },
        })).render();
      }

      function cizGaranti(v) {
        if (gBos('c-garanti', v)) return;
        const t = gGrafikTemel();
        t.chart.type = 'donut';
        new ApexCharts(gKap('c-garanti'), Object.assign(t, {
          series: v.map(function (d) { return Number(d.count); }),
          labels: v.map(function (d) { return gDurum(d.status).ad; }),
          colors: v.map(function (d) { return gDurum(d.status).renk; }),
          legend: { position: 'bottom' },
          plotOptions: { pie: { donut: { size: '64%' } } },
        })).render();
      }

      function cizKategori(v) {
        if (gBos('c-kategori', v)) return;
        const t = gGrafikTemel();
        t.chart.type = 'bar';
        new ApexCharts(gKap('c-kategori'), Object.assign(t, {
          series: [{ name: 'Cihaz', data: v.map(function (d) { return Number(d.count); }) }],
          xaxis: { categories: v.map(function (d) { return gKategori(d.category); }) },
          plotOptions: { bar: { borderRadius: 5, distributed: true, columnWidth: '55%' } },
          legend: { show: false },
        })).render();
      }

      function cizMarka(v) {
        if (gBos('c-marka', v)) return;
        const t = gGrafikTemel();
        t.chart.type = 'bar';
        new ApexCharts(gKap('c-marka'), Object.assign(t, {
          series: [{ name: 'Cihaz', data: v.map(function (d) { return Number(d.count); }) }],
          xaxis: { categories: v.map(function (d) { return d.brand; }) },
          plotOptions: { bar: { horizontal: true, borderRadius: 5, barHeight: '62%' } },
          colors: [G_RENK[2]],
        })).render();
      }

      function sonCihaz(v) {
        const tb = document.getElementById('son-cihaz');
        if (!v || !v.length) {
          tb.innerHTML = '<tr><td colspan="3" class="soluk">Kayit yok</td></tr>';
          return;
        }
        /* Kullanıcı verisi `gEsc` ile kaciriliyor (gerekce: garanmin-api.js).
           `title`: sutunlar sabit genislikte, uzun deger kesiliyor. */
        tb.innerHTML = v.map(function (d) {
          return '<tr>'
            + '<td title="' + gEsc(d.name) + '">' + gEsc(d.name) + '</td>'
            + '<td title="' + gEsc(d.brand) + '">' + gEsc(d.brand) + '</td>'
            + '<td class="soluk" title="' + gEsc(d.email || '-') + '">' + gEsc(d.email || '-') + '</td>'
            + '</tr>';
        }).join('');
      }

      if (garanminGuardPage()) {
        garanminShell('garanmin-dashboard.html', 'Genel Bakis', 'Panel');
        yukle();
      }
    </script>
  </body>
</html>
