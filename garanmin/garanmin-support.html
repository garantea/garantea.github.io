<!doctype html>
<!--
  GARANMIN — Destek / Talepler.

  ─── TALEP TURU `kind` SUTUNUNDAN OKUNUYOR ────────────────────────────────

  Uygulama destek kaydini `insert({ user_id, kind, data })` seklinde yaziyor: tur
  UST DUZEYDE bir sutun, mesaj/durum/puan ise `data` JSONB'sinin icinde. Onceki
  surum turu `data->>'kind'` diye okuyordu ve orada hicbir zaman bir deger yok —
  grafik her zaman tek bir "Diger" dilimi gosterirdi. Cihaz tarafinda duzeltilen
  hatanin destek tarafindaki esi.

  MESAJLAR KULLANICININ YAZDIGI METIN: hepsi `gEsc` ile kacirilarak basiliyor.
  Dogrudan basilsaydi, mesajina `<img onerror=...>` yazan bir kullanici
  yöneticinin tarayicisinda kod calistirabilirdi — ve o tarayicida gecerli bir
  yönetici oturumu var.
-->
<html lang="tr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Garanmin — Destek</title>
    <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="assets/adminator/adminator.css" />
    <link rel="stylesheet" href="assets/css/garanmin.css" />
  </head>

  <body>
    <div class="shell" id="g-app">
      <aside class="d-sidebar" id="garanmin-menu"></aside>

      <div class="main">
        <header class="d-topbar" id="garanmin-navbar"></header>

        <main class="content">
          <div id="garanmin-error"></div>
          <div class="kpi-grid" id="serit"></div>

          <div class="grid">
            <section class="card col-8">
              <div class="card-head">
                <div class="card-title-wrap">
                  <span class="eyebrow">Son 200 kayit</span>
                  <h2 class="card-title">Talepler</h2>
                </div>
                <div class="g-arac">
                  <button class="btn btn--danger btn--sm" id="btn-toplu-kapat" onclick="topluKapat()" title="Secili Olanlari Kapat">Seçilileri Kapat</button>
                </div>
              </div>
              <div class="g-tablo-kutu-esnek">
                <table class="table">
                  <!-- Sutun genislikleri SABIT (gerekce: garanmin.css). Toplam %100.
                       Mesaj sutunu en genis: kesilmek yerine saran tek sutun o. -->
                  <colgroup>
                    <col style="width:4%"><col style="width:14%"><col style="width:18%"><col style="width:12%">
                    <col style="width:9%"><col style="width:12%"><col style="width:31%">
                  </colgroup>
                  <thead>
                    <tr>
                      <th><input type="checkbox" id="chk-hepsi" onclick="hepsiniSec(this)"></th>
                      <th>Tarih</th><th>Kullanıcı</th><th>Tur</th><th>Durum</th><th>Cihaz</th><th>Mesaj</th>
                    </tr>
                  </thead>
                  <tbody id="tbody"><tr><td colspan="6" class="soluk">Yukleniyor...</td></tr></tbody>
                </table>
              </div>
            </section>

            <section class="card col-4">
              <div class="card-head">
                <div class="card-title-wrap">
                  <span class="eyebrow">Dagilim</span>
                  <h2 class="card-title">Talep turleri</h2>
                </div>
              </div>
              <div class="g-grafik-wrap">
                <div class="g-grafik uzun" id="c-tur"></div>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script src="assets/vendor/libs/apex-charts/apexcharts.js"></script>
    <script src="assets/js/garanmin-api.js"></script>
    <script>
      /* Uygulamadaki `SupportTicketKind` degerlerinin okunur karsiligi. */
      const TUR = { device_issue: 'Cihaz sorunu', general: 'Genel', feedback: 'Geri bildirim' };
      const ROZET = { open: 'warning', closed: 'success', pending: 'primary' };

      async function yukle() {
        try {
          const [stats, tur, liste] = await Promise.all([
            garanminData('garanmin_stats'),
            garanminData('garanmin_ticket_stats'),
            garanminData('garanmin_tickets_list', { p_limit: 200 }),
          ]);

          const acik = liste.filter(function (t) { return t.status === 'open'; }).length;
          const puanli = liste.filter(function (t) { return t.rating != null; });
          const ortPuan = puanli.length
            ? (puanli.reduce(function (a, t) { return a + Number(t.rating); }, 0) / puanli.length).toFixed(1)
            : '-';

          gKpiYaz('serit', [
            { etiket: 'Toplam talep',  deger: gNum(stats.support_tickets_total), ikon: 'support',  renk: 'primary' },
            { etiket: 'Son 7 gun',     deger: gNum(stats.support_tickets_7d),    ikon: 'calendar', renk: 'purple' },
            { etiket: 'Acik',          deger: gNum(acik),                        ikon: 'clock',    renk: 'warning' },
            { etiket: 'Ortalama puan', deger: ortPuan,                           ikon: 'star',     renk: 'success' },
          ]);

          const tb = document.getElementById('tbody');
          tb.innerHTML = liste.length
            ? liste.map(function (t) {
                const js = btoa(unescape(encodeURIComponent(JSON.stringify(t))));
                return '<tr style="cursor:pointer" onclick="detay(\'' + js + '\')">'
                  + '<td onclick="event.stopPropagation()"><input type="checkbox" class="chk-bilet"></td>'
                  + '<td class="soluk">' + gDateTime(t.created_at) + '</td>'
                  + '<td title="' + gEsc(t.email || '-') + '">' + gEsc(t.email || '-') + '</td>'
                  + '<td>' + gEsc(TUR[t.kind] || t.kind) + '</td>'
                  + '<td><span class="badge ' + (ROZET[t.status] || 'primary') + '">'
                    + gEsc(t.status) + '</span></td>'
                  + '<td title="' + gEsc(t.device_name || '-') + '">' + gEsc(t.device_name || '-') + '</td>'
                  /* `metin` sinifi: genisligi colgroup veriyor, hucre sarmali. */
                  + '<td class="metin">' + gEsc(t.message) + '</td>'
                  + '</tr>';
              }).join('')
            : '<tr><td colspan="6" class="soluk">Talep yok</td></tr>';

          if (!gBos('c-tur', tur)) {
            const t2 = gGrafikTemel(); t2.chart.type = 'donut';
            new ApexCharts(gKap('c-tur'), Object.assign(t2, {
              series: tur.map(function (d) { return Number(d.count); }),
              labels: tur.map(function (d) { return TUR[d.kind] || d.kind; }),
              legend: { position: 'bottom', fontSize: '11.5px' },
              plotOptions: { pie: { donut: { size: '62%' } } },
            })).render();
          }
        } catch (e) { gError(e.message); }
      }

      function detay(js) {
        const t = JSON.parse(decodeURIComponent(escape(atob(js))));
        const modalBody = `
          <div style="display:flex; flex-direction:column; gap: 14px;">
            <div class="card" style="padding: 16px; background: var(--bg-body); border: 1px solid var(--b-base); box-shadow: none;">
              <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                <span class="eyebrow">${gEsc(TUR[t.kind] || t.kind)} - ${gEsc(t.device_name || 'Genel')}</span>
                <span class="soluk" style="font-size:11px">${gDateTime(t.created_at)}</span>
              </div>
              <div style="font-size: 14px; line-height: 1.5;">${gEsc(t.message)}</div>
            </div>
            <div style="display:flex; flex-direction:column; gap: 8px;">
              <div class="eyebrow" style="color: var(--t-base);">Kullanıcıya Yanıt Gönder</div>
              <textarea class="input" style="width:100%; height: 120px; resize: none; padding: 12px; font-family: inherit;" placeholder="Merhaba, talebinizle ilgili..."></textarea>
              <div style="display: flex; justify-content: flex-end; margin-top: 4px;">
                <button class="btn btn--primary" onclick="sahteCevap(this)">Yanıtı İlet</button>
              </div>
            </div>
          </div>
        `;
        garanminModalAc(
          '<div class="g-modal-kim">'
          + '<span class="avatar">' + gEsc((t.email || '?').slice(0, 2).toUpperCase()) + '</span>'
          + '<div><span class="eyebrow">Talep Sahibi</span>'
          + '<div class="modal-title">' + gEsc(t.email || 'Bilinmeyen Kullanıcı') + '</div></div></div>',
          modalBody
        );
      }

      function sahteCevap(btn) {
        btn.innerHTML = gIkon('check') + ' Gönderildi';
        btn.classList.add('success');
        btn.disabled = true;
        setTimeout(function() {
          const k = document.querySelector('.g-modal-kapat') || document.querySelector('.g-modal-bas .icon-btn');
          if (k) k.click();
          else garanminModalKapat();
        }, 1200);
      }

      function hepsiniSec(chk) {
        document.querySelectorAll('.chk-bilet').forEach(c => c.checked = chk.checked);
      }
      function topluKapat() {
        const checked = document.querySelectorAll('.chk-bilet:checked');
        if (checked.length === 0) {
          gError('Lutfen once kapatilacak kayitlari secin.');
          setTimeout(() => { document.getElementById('garanmin-error').innerHTML = ''; }, 3000);
          return;
        }
        if (confirm(checked.length + ' adet secili talebi topluca kapatmak istediginize emin misiniz?')) {
          checked.forEach(c => {
             const row = c.closest('tr');
             const statusCell = row.querySelectorAll('td')[4];
             statusCell.innerHTML = '<span class="badge success">closed</span>';
             c.checked = false;
          });
          document.getElementById('chk-hepsi').checked = false;
          gError(checked.length + ' talep basariyla kapatildi (Mock).');
          setTimeout(() => { document.getElementById('garanmin-error').innerHTML = ''; }, 3000);
        }
      }

      if (garanminGuardPage()) {
        garanminShell('garanmin-support.html', 'Destek Talepleri', 'Uygulama Etkileşimi');
        yukle();
      }
    </script>
  </body>
</html>
