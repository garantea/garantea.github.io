<!doctype html>
<!--
  GARANMIN — Veri Tabanı / Tablolar.

  Uygulamanin kullandigi tablolarin satir sayisi, disk boyutu ve RLS durumu.

  ─── SATIR SAYISI TAHMIN DEGIL ────────────────────────────────────────────

  `pg_class.reltuples` cok daha ucuz olurdu ama VACUUM'a bagli bir TAHMIN; yeni
  yazilmis satirlar orada gorunmuyor ve panelde "13 cihaz ekledim, 0 yaziyor"
  gibi bir tabloya yol acardi. Bu boyuttaki bir veritabanında gercek `count(*)`
  ihmal edilebilir; dogruluk daha degerli.

  ─── RLS SUTUNU NEDEN VAR ─────────────────────────────────────────────────

  Satir guvenligi kapali kalmis bir tablo HICBIR HATA URETMEZ; yalnizca herkes
  her satiri gorur. Sessiz kalan bir seyin gorunur oldugu tek yer bu tur bir liste.
-->
<html lang="tr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Garanmin — Veri Tabanı</title>
    <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="assets/adminator/adminator.css" />
    <link rel="stylesheet" href="assets/css/garanmin.css" />
  </head>

  <body>
    <div class="shell" id="g-app">
      <aside class="d-sidebar" id="garanmin-menu"></aside>

      <div class="main">
        <header class="d-topbar" id="garanmin-navbar"></header>

        <main class="content">
          <div id="garanmin-error"></div>
          <div class="kpi-grid" id="serit"></div>

          <div class="grid">
            <section class="card col-7">
              <div class="card-head">
                <div class="card-title-wrap">
                  <span class="eyebrow">Public sema</span>
                  <h2 class="card-title">Tablolar</h2>
                </div>
              </div>
              <div class="g-tablo-kutu-esnek">
                <table class="table">
                  <!-- Sutun genislikleri SABIT (gerekce: garanmin.css). Toplam %100. -->
                  <colgroup>
                    <col style="width:40%"><col style="width:14%"><col style="width:14%">
                    <col style="width:16%"><col style="width:16%">
                  </colgroup>
                  <thead>
                    <tr><th>Tablo</th><th class="sayi">Satir</th><th class="sayi">Boyut</th><th>RLS</th><th>Rol</th></tr>
                  </thead>
                  <tbody id="tablolar"><tr><td colspan="5" class="soluk">Yukleniyor...</td></tr></tbody>
                </table>
              </div>
            </section>

            <section class="card col-5">
              <div class="card-head">
                <div class="card-title-wrap">
                  <span class="eyebrow">Dagilim</span>
                  <h2 class="card-title">Satirlarin dagilimi</h2>
                </div>
              </div>
              <div class="g-grafik-wrap">
                <div class="g-grafik uzun" id="c-dagilim"></div>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script src="assets/vendor/libs/apex-charts/apexcharts.js"></script>
    <script src="assets/js/garanmin-api.js"></script>
    <script>
      /* Her tablonun ne ise yaradigi — panelde "bu tablo neydi" sorusu kalmasin. */
      const ACIKLAMA = {
        devices:                 'Kullanıcı cihazlari (JSONB)',
        user_meta:               'Kredi ve ayarlar',
        support_tickets:         'Destek talepleri',
        garanmin_users:          'Panel yöneticileri',
        garanmin_sessions:       'Acik panel oturumlari',
        garanmin_login_attempts: 'Giris denemeleri',
      };

      async function yukle() {
        try {
          const [t, h] = await Promise.all([
            garanminData('garanmin_db_tables'),
            garanminData('garanmin_health'),
          ]);

          const toplamSatir = t.reduce(function (a, x) { return a + Number(x.satir); }, 0);
          const toplamBayt  = t.reduce(function (a, x) { return a + Number(x.boyut_bayt); }, 0);
          const rlsKapali   = t.filter(function (x) { return !x.rls; }).length;

          gKpiYaz('serit', [
            { etiket: 'Tablo',             deger: t.length,          ikon: 'layers',   renk: 'primary' },
            { etiket: 'Toplam satir',      deger: gNum(toplamSatir), ikon: 'list',     renk: 'success' },
            { etiket: 'Tablolarin boyutu', deger: gBayt(toplamBayt), ikon: 'hdd',      renk: 'warning' },
            { etiket: 'Veritabanı boyutu', deger: h.db_size_text,    ikon: 'database', renk: 'purple' },
          ]);

          document.getElementById('tablolar').innerHTML = t.map(function (x) {
            /* Panel tablolari `anon`a KAPALI, uygulama tablolari kullaniciya acik
               ama RLS ile kendi satirlariyla sinirli. Ikisi ayri seyler. */
            const panel = x.tablo.indexOf('garanmin_') === 0;
            return '<tr>'
              + '<td title="' + gEsc(x.tablo) + '">' + gEsc(x.tablo)
              + '<div style="font-size:11px;color:var(--t-light)">'
                + gEsc(ACIKLAMA[x.tablo] || '') + '</div></td>'
              + '<td class="sayi">' + gNum(x.satir) + '</td>'
              + '<td class="sayi">' + gEsc(x.boyut) + '</td>'
              + '<td>' + (x.rls
                  ? '<span class="badge success">acik</span>'
                  : '<span class="badge danger">KAPALI</span>') + '</td>'
              + '<td>' + (panel
                  ? '<span class="badge purple">panel</span>'
                  : '<span class="badge primary">uygulama</span>') + '</td>'
              + '</tr>';
          }).join('');

          if (rlsKapali) {
            gError(rlsKapali + ' tabloda satir guvenligi (RLS) kapali. Bu tablolarin butun satirlari disaridan okunabilir.');
          }

          cizDagilim(t.filter(function (x) { return Number(x.satir) > 0; }));
        } catch (e) { gError(e.message); }
      }

      function cizDagilim(v) {
        if (gBos('c-dagilim', v)) return;
        const t = gGrafikTemel();
        t.chart.type = 'donut';
        new ApexCharts(gKap('c-dagilim'), Object.assign(t, {
          series: v.map(function (x) { return Number(x.satir); }),
          labels: v.map(function (x) { return x.tablo; }),
          legend: { position: 'bottom', fontSize: '11.5px' },
          plotOptions: { pie: { donut: { size: '62%', labels: {
            show: true,
            total: { show: true, label: 'Toplam satir', fontSize: '11px' },
          } } } },
        })).render();
      }

      if (garanminGuardPage()) {
        garanminShell('garanmin-db.html', 'Veri Tabanı', 'Tablolar');
        yukle();
      }
    </script>
  </body>
</html>
