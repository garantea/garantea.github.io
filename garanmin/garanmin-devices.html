<!doctype html>
<!--
  GARANMIN — Cihazlar / Kırılımlar.

  Butun sayilar `devices.data` JSONB'sinden okunuyor. Uygulama cihazin butun
  alanlarini tek bir JSONB sutununa yaziyor; duz sutunlar (brand, category, room)
  tabloda hic yok. Onceki panel onlari okudugu icin sayilar dogru ama kirilimlar
  bombosti — hata vermeyen, teshisi en zor turden bir yanlislik.

  GARANTI ESIGI "%90 TUKENDI", "30 GUN KALDI" DEGIL: uygulamadaki
  `lib/warranty.ts` boyle sayiyor. Iki taraf farkli sayarsa panel, kullanicinin
  telefonunda gordugunden baska bir tablo gosterir ve hangisinin dogru oldugu
  anlasilmaz.
-->
<html lang="tr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Garanmin — Cihazlar</title>
    <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="assets/adminator/adminator.css" />
    <link rel="stylesheet" href="assets/css/garanmin.css" />
  </head>

  <body>
    <div class="shell" id="g-app">
      <aside class="d-sidebar" id="garanmin-menu"></aside>

      <div class="main">
        <header class="d-topbar" id="garanmin-navbar"></header>

        <main class="content">
          <div id="garanmin-error"></div>
          <div class="kpi-grid" id="serit"></div>

          <div class="grid">
            <section class="card col-7">
              <div class="card-head">
                <div class="card-title-wrap">
                  <span class="eyebrow">Kirilim</span>
                  <h2 class="card-title">Kategoriler</h2>
                </div>
              </div>
              <div class="g-grafik-wrap">
                <div class="g-grafik uzun" id="c-kategori"></div>
              </div>
            </section>

            <section class="card col-5">
              <div class="card-head">
                <div class="card-title-wrap">
                  <span class="eyebrow">Cihazlar</span>
                  <h2 class="card-title">Garanti durumu</h2>
                </div>
              </div>
              <div class="g-grafik-wrap">
                <div class="g-grafik uzun" id="c-garanti"></div>
              </div>
            </section>

            <section class="card col-6">
              <div class="card-head">
                <div class="card-title-wrap">
                  <span class="eyebrow">Kirilim</span>
                  <h2 class="card-title">En çok eklenen markalar</h2>
                </div>
              </div>
              <div class="g-grafik-wrap">
                <div class="g-grafik" id="c-marka"></div>
              </div>
            </section>

            <section class="card col-6">
              <div class="card-head">
                <div class="card-title-wrap">
                  <span class="eyebrow">Kirilim</span>
                  <h2 class="card-title">Odalar</h2>
                </div>
              </div>
              <div class="g-grafik-wrap">
                <div class="g-grafik" id="c-oda"></div>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script src="assets/vendor/libs/apex-charts/apexcharts.js"></script>
    <script src="assets/js/garanmin-api.js"></script>
    <script>
      async function yukle() {
        try {
          const [stats, kategori, marka, garanti, oda] = await Promise.all([
            garanminData('garanmin_stats'),
            garanminData('garanmin_device_categories'),
            garanminData('garanmin_device_brands'),
            garanminData('garanmin_warranty_stats'),
            garanminData('garanmin_room_stats'),
          ]);

          const bul = function (k) {
            const x = garanti.find(function (d) { return d.status === k; });
            return x ? Number(x.count) : 0;
          };

          gKpiYaz('serit', [
            { etiket: 'Toplam cihaz',    deger: gNum(stats.total_devices),  ikon: 'monitor', renk: 'primary' },
            { etiket: 'Aktif garanti',   deger: gNum(bul('active')),        ikon: 'shield',  renk: 'success' },
            { etiket: 'Yakinda bitiyor', deger: gNum(bul('expiring_soon')), ikon: 'clock',   renk: 'warning' },
            { etiket: 'Suresi dolmus',   deger: gNum(bul('expired')),       ikon: 'alert',   renk: 'danger' },
          ]);

          ciz('c-kategori', 'bar', {
            series: [{ name: 'Cihaz', data: kategori.map(function (d) { return Number(d.count); }) }],
            xaxis: { categories: kategori.map(function (d) { return gKategori(d.category); }) },
            plotOptions: { bar: { borderRadius: 5, distributed: true, columnWidth: '55%' } },
            legend: { show: false },
            chart: {
              events: {
                dataPointSelection: function(event, chartContext, config) {
                  if (config.dataPointIndex >= 0) {
                    const rawCategory = kategori[config.dataPointIndex].category;
                    const catName = gKategori(rawCategory);
                    kategoriCihazGoster(rawCategory, catName);
                  }
                }
              }
            }
          }, kategori);

          ciz('c-garanti', 'donut', {
            series: garanti.map(function (d) { return Number(d.count); }),
            labels: garanti.map(function (d) { return gDurum(d.status).ad; }),
            colors: garanti.map(function (d) { return gDurum(d.status).renk; }),
            legend: { position: 'bottom' },
            plotOptions: { pie: { donut: { size: '64%' } } },
          }, garanti);

          ciz('c-marka', 'bar', {
            series: [{ name: 'Cihaz', data: marka.map(function (d) { return Number(d.count); }) }],
            xaxis: { categories: marka.map(function (d) { return d.brand; }) },
            plotOptions: { bar: { horizontal: true, borderRadius: 5, barHeight: '60%' } },
            colors: [G_RENK[2]],
          }, marka);

          ciz('c-oda', 'bar', {
            series: [{ name: 'Cihaz', data: oda.map(function (d) { return Number(d.count); }) }],
            xaxis: { categories: oda.map(function (d) { return d.room; }) },
            plotOptions: { bar: { horizontal: true, borderRadius: 5, barHeight: '60%' } },
            colors: [G_RENK[4]],
          }, oda);
        } catch (e) { gError(e.message); }
      }

      /* Veri yoksa grafik CIZILMIYOR, "veri yok" yaziliyor: ApexCharts bos bir
         dizide eksenleri ve bos bir izgarayi yine de cizer ve bu, "veri gelmedi"
         ile "veri sifir" arasindaki farki gorunmez kilar. */
      function ciz(hedef, tip, ayar, veri) {
        if (gBos(hedef, veri)) return;
        const t = gGrafikTemel();
        t.chart.type = tip;
        // Eğer ayar icinde chart.events varsa temel ayarlardakilerle birlestir (ezme)
        if (ayar.chart && ayar.chart.events) {
            t.chart.events = Object.assign(t.chart.events || {}, ayar.chart.events);
            delete ayar.chart.events;
        }
        new ApexCharts(gKap(hedef), Object.assign(t, ayar)).render();
      }

      async function kategoriCihazGoster(rawCat, catName) {
        garanminModalAc(
          '<div class="g-modal-kim">'
          + '<div style="display:flex; align-items:center; gap:16px;">'
          + '<div class="avatar" style="width:48px; height:48px; display:flex; align-items:center; justify-content:center; background:var(--primary-soft); color:var(--primary); font-size:20px; border-radius:8px;">' + gIkon('box') + '</div>'
          + '<div><span class="eyebrow">Kategori Detayı</span>'
          + '<div class="modal-title">' + gEsc(catName) + '</div></div></div></div>',
          '<div class="g-bos">' + gIkon('refresh') + '<span>Yükleniyor...</span></div>'
        );
        try {
          const all = await garanminData('garanmin_recent_devices', { p_limit: 1000 });
          const filtered = all.filter(c => c.category === rawCat);
          
          if (!filtered.length) {
            document.getElementById('g-modal-govde').innerHTML = '<div class="g-bos">Bu kategoride son eklenen bir cihaz bulunamadı.</div>';
            return;
          }
          
          const tbody = filtered.map(d => {
             return '<tr><td>' + gEsc(d.name) + '</td><td>' + gEsc(d.brand) + '</td><td>' + gDate(d.purchase_date) + '</td></tr>';
          }).join('');
          
          document.getElementById('g-modal-govde').innerHTML = '<div class="g-tablo-kutu-esnek" style="max-height:400px; overflow-y:auto; padding:0;">'
            + '<table class="table" style="margin:0;"><thead><tr><th>Cihaz</th><th>Marka</th><th>Alım Tarihi</th></tr></thead>'
            + '<tbody>' + tbody + '</tbody></table></div>';
        } catch(e) {
            document.getElementById('g-modal-govde').innerHTML = '<div class="g-uyari danger">' + gEsc(e.message) + '</div>';
        }
      }

      if (garanminGuardPage()) {
        garanminShell('garanmin-devices.html', 'Cihaz Kırılımlari', 'Cihazlar');
        yukle();
      }
    </script>
  </body>
</html>
