<!doctype html>
<!--
  GARANMIN — Sistem Durumu.

  Ust cubuktaki canli gostergesi "baglanti var mi" sorusunu tek bakista
  cevapliyor; bu sayfa AYRINTIYI veriyor: sunucu saati, tarayici saatiyle farki,
  veritabaninin ne zamandir ayakta oldugu, kaydin buyumesi ve oturum bilgisi.

  ─── SAAT FARKI NEDEN ONEMLI ──────────────────────────────────────────────

  Garanti hesaplarinin tamami tarihe bagli. Tarayicinin saati kaymissa panel
  yanlis ama TUTARLI gorunen bir tablo gosterir: hicbir yerde hata cikmaz,
  yalnizca "yakinda bitiyor" sayisi gercegin disinda olur. Bu yuzden fark
  aciktan yaziliyor.
-->
<html lang="tr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Garanmin — Sistem Durumu</title>
    <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="assets/adminator/adminator.css" />
    <link rel="stylesheet" href="assets/css/garanmin.css" />
  </head>

  <body>
    <div class="shell" id="g-app">
      <aside class="d-sidebar" id="garanmin-menu"></aside>

      <div class="main">
        <header class="d-topbar" id="garanmin-navbar"></header>

        <main class="content">
          <div id="garanmin-error"></div>
          <div class="kpi-grid" id="serit"></div>

          <div class="grid">
            <section class="card col-6">
              <div class="card-head">
                <div class="card-title-wrap">
                  <span class="eyebrow">Baglanti</span>
                  <h2 class="card-title">Sunucu</h2>
                </div>
              </div>
              <div id="sunucu"></div>
            </section>

            <section class="card col-6">
              <div class="card-head">
                <div class="card-title-wrap">
                  <span class="eyebrow">Erisim</span>
                  <h2 class="card-title">Oturum ve guvenlik</h2>
                </div>
              </div>
              <div id="oturum"></div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script src="assets/js/garanmin-api.js"></script>
    <script>
      function sure(ms) {
        const dk = Math.floor(ms / 60000);
        if (dk < 60) return dk + ' dakika';
        const sa = Math.floor(dk / 60);
        if (sa < 24) return sa + ' saat ' + (dk % 60) + ' dk';
        return Math.floor(sa / 24) + ' gun ' + (sa % 24) + ' saat';
      }

      async function yukle() {
        try {
          const [h, t] = await Promise.all([
            garanminData('garanmin_health'),
            garanminData('garanmin_db_tables'),
          ]);

          const sunucuSaat = new Date(h.server_time);
          const fark = Math.round((sunucuSaat - new Date()) / 1000);
          const toplamSatir = t.reduce(function (a, x) { return a + Number(x.satir); }, 0);
          const rlsKapali = t.filter(function (x) { return !x.rls; });

          gKpiYaz('serit', [
            { etiket: 'Baglanti',            deger: 'CANLI',            ikon: 'activity', renk: 'success' },
            { etiket: 'Veritabani boyutu',   deger: h.db_size_text,     ikon: 'database', renk: 'purple' },
            { etiket: 'Toplam satir',        deger: gNum(toplamSatir),  ikon: 'list',     renk: 'primary' },
            { etiket: 'RLS acik olmayan tablo', deger: rlsKapali.length,
              ikon: rlsKapali.length ? 'alert' : 'shield',
              renk: rlsKapali.length ? 'danger' : 'success' },
          ]);

          document.getElementById('sunucu').innerHTML =
            gKv('Sunucu saati', sunucuSaat.toLocaleString('tr-TR'))
            + gKv('Tarayici saati', new Date().toLocaleString('tr-TR'))
            + gKv('Fark', Math.abs(fark) + ' saniye',
                Math.abs(fark) > 120
                  ? 'DIKKAT: iki saat arasinda 2 dakikadan fazla fark var. Garanti hesaplari tarihe bagli oldugu icin panel yaniltici olabilir.'
                  : 'Kabul edilebilir araligin icinde.')
            + gKv('Veritabani ayakta', sure(new Date() - new Date(h.started_at)),
                'Baslangic: ' + gDateTime(h.started_at))
            + gKv('Veritabani boyutu', h.db_size_text + ' (' + gNum(h.db_size) + ' bayt)')
            + gKv('Adres', '<span style="font-family:\'JetBrains Mono\',monospace;font-size:11px">'
                + gEsc(GARANMIN.supabaseUrl.replace('https://', '')) + '</span>');

          const exp = garanminExp();
          document.getElementById('oturum').innerHTML =
            gKv('Oturum sahibi', gEsc(garanminUser()))
            + gKv('Oturum bitisi', exp ? gDateTime(exp) : '-',
                'Jeton 8 saat sonra sunucuda gecersiz oluyor.')
            + gKv('Jeton nerede', 'sessionStorage',
                'Sekme kapaninca siliniyor; ortak bilgisayarda oturum bir sonraki kisiye devrolmuyor.')
            + gKv('Parola saklama', 'bcrypt (maliyet 12)',
                'Tek bir deneme ~250 ms suruyor; cevrimici kaba kuvvet pratikte imkansiz.')
            + gKv('Basarisiz denemede', 'Kademeli gecikme',
                'Kilitleme YOK — kilitleme, saldirganin yoneticiyi disarida birakmasina izin verirdi.')
            + gKv('Panel yetkisi', 'Yalnizca okuma',
                'Hicbir fonksiyon veri yazmiyor ya da silmiyor.')
            + (rlsKapali.length
                ? '<div class="g-uyari danger" style="margin:16px 0 0">' + gIkon('alert')
                  + '<span>RLS kapali tablo: '
                  + rlsKapali.map(function (x) { return gEsc(x.tablo); }).join(', ') + '</span></div>'
                : '');
        } catch (e) { gError(e.message); }
      }

      if (garanminGuardPage()) {
        garanminShell('garanmin-sistem.html', 'Sistem Durumu', 'Genel');
        yukle();
      }
    </script>
  </body>
</html>
