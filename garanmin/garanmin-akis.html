<!doctype html>
<!--
  GARANMIN — Veri Tabanı / Zaman Akışı.

  Kayitlarin gune gore nasil biriktigi: kullanici, cihaz, destek talebi.

  ─── BOS GUNLER SIFIR OLARAK GELIYOR ──────────────────────────────────────

  Sunucudaki `garanmin_akis` butun gunleri `generate_series` ile uretiyor.
  Yalnizca veri olan gunler donseydi, uc seri farkli gunlerde baslar ve grafikte
  tarihler birbirinin uzerine kayardi — 3 Agustos'taki cihaz artisi 7 Agustos'taki
  kullanici artisiyla ayni sutunda gorunurdu. "Veri yok" ile "sifir" ayri seyler.
-->
<html lang="tr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Garanmin — Zaman Akışı</title>
    <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="assets/adminator/adminator.css" />
    <link rel="stylesheet" href="assets/css/garanmin.css" />
  </head>

  <body>
    <div class="shell" id="g-app">
      <aside class="d-sidebar" id="garanmin-menu"></aside>

      <div class="main">
        <header class="d-topbar" id="garanmin-navbar"></header>

        <main class="content">
          <div id="garanmin-error"></div>
          <div class="grid" style="flex: 1.5; margin-bottom: 14px;">
            <div class="col-6" style="display: flex; flex-direction: column; min-height: 0;">
              <div class="kpi-grid" id="serit" style="grid-template-columns: repeat(2, 1fr); margin-bottom: 14px;"></div>
              
              <section class="card" style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
                <div class="card-head">
                  <div class="card-title-wrap">
                    <span class="eyebrow">Gunluk</span>
                    <h2 class="card-title">Kayıt akışı</h2>
                  </div>
                  <div class="g-arac">
                    <button class="btn btn--primary btn--sm" onclick="setGun(7)"  id="g7">7 gun</button>
                    <button class="btn btn--ghost btn--sm"   onclick="setGun(30)" id="g30">30 gun</button>
                    <button class="btn btn--ghost btn--sm"   onclick="setGun(90)" id="g90">90 gun</button>
                  </div>
                </div>
                <div class="g-grafik-wrap" style="flex: 1; min-height: 0;">
                  <div class="g-grafik" id="c-akis" style="height: 100%"></div>
                </div>
              </section>
            </div>

            <section class="card col-6" style="display: flex; flex-direction: column; min-height: 0;">
              <div class="card-head">
                <div class="card-title-wrap">
                  <span class="eyebrow">Toplam Büyüme</span>
                  <h2 class="card-title">Kümülatif Gelişim</h2>
                </div>
              </div>
              <div class="g-grafik-wrap" style="flex: 1; min-height: 0;">
                <div class="g-grafik" id="c-kumulatif" style="height: 100%"></div>
              </div>
            </section>
          </div>

          <div class="grid" style="flex: 1;">
            <section class="card col-4" style="display: flex; flex-direction: column; min-height: 0;">
              <div class="card-head">
                <div class="card-title-wrap">
                  <span class="eyebrow">Gunluk</span>
                  <h2 class="card-title">Kullanıcı</h2>
                </div>
              </div>
              <div class="g-grafik-wrap" style="flex: 1; min-height: 0;">
                <div class="g-grafik" id="c-k" style="height: 100%"></div>
              </div>
            </section>

            <section class="card col-4" style="display: flex; flex-direction: column; min-height: 0;">
              <div class="card-head">
                <div class="card-title-wrap">
                  <span class="eyebrow">Gunluk</span>
                  <h2 class="card-title">Cihaz</h2>
                </div>
              </div>
              <div class="g-grafik-wrap" style="flex: 1; min-height: 0;">
                <div class="g-grafik" id="c-c" style="height: 100%"></div>
              </div>
            </section>

            <section class="card col-4" style="display: flex; flex-direction: column; min-height: 0;">
              <div class="card-head">
                <div class="card-title-wrap">
                  <span class="eyebrow">Gunluk</span>
                  <h2 class="card-title">Destek</h2>
                </div>
              </div>
              <div class="g-grafik-wrap" style="flex: 1; min-height: 0;">
                <div class="g-grafik" id="c-t" style="height: 100%"></div>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script src="assets/vendor/libs/apex-charts/apexcharts.js"></script>
    <script src="assets/js/garanmin-api.js"></script>
    <script>
      let gun = 7;
      /* Cizilen grafikler tutuluyor: aralik degistiginde eskisi YOK EDILMELI.
         Yok edilmezse ApexCharts ayni kapsayiciya ikinci bir grafik cizer ve
         ustuste binen iki tablo olusur. */
      let grafikler = [];

      function temizle() {
        grafikler.forEach(function (g) { try { g.destroy(); } catch (e) {} });
        grafikler = [];
      }

      function setGun(g) {
        gun = g;
        [7, 30, 90].forEach(function (x) {
          document.getElementById('g' + x).className =
            'btn btn--sm ' + (x === g ? 'btn--primary' : 'btn--ghost');
        });
        yukle();
      }

      function mini(hedef, veri, etiketler, renk) {
        if (gBos(hedef, veri)) return;
        const t = gGrafikTemel();
        t.chart.type = 'bar';
        const g = new ApexCharts(gKap(hedef), Object.assign(t, {
          series: [{ name: 'Adet', data: veri }],
          xaxis: { 
            categories: etiketler, 
            labels: { rotate: 0, hideOverlappingLabels: true, style: { fontSize: '10px' } } 
          },
          yaxis: { 
            labels: { style: { fontSize: '10px' } } 
          },
          plotOptions: { bar: { borderRadius: 3, columnWidth: '70%' } },
          colors: [renk],
        }));
        g.render(); grafikler.push(g);
      }

      async function yukle() {
        try {
          temizle();
          const v = await garanminData('garanmin_akis', { p_gun: gun });
          const etiket = v.map(function (d) { return gDate(d.gun); });
          const k = v.map(function (d) { return Number(d.kullanici); });
          const c = v.map(function (d) { return Number(d.cihaz); });
          const t = v.map(function (d) { return Number(d.talep); });
          const top = function (a) { return a.reduce(function (x, y) { return x + y; }, 0); };

          gKpiYaz('serit', [
            { etiket: 'Yeni kullanici (' + gun + ' gun)', deger: gNum(top(k)), ikon: 'userPlus', renk: 'primary' },
            { etiket: 'Eklenen cihaz', deger: gNum(top(c)), ikon: 'monitor', renk: 'success' },
            { etiket: 'Destek talebi', deger: gNum(top(t)), ikon: 'support', renk: 'danger' },
            { etiket: 'Gunluk ortalama cihaz',
              deger: gNum((top(c) / Math.max(1, v.length)).toFixed(1)), ikon: 'trend', renk: 'warning' },
          ]);

          if (!gBos('c-akis', v)) {
            const base = gGrafikTemel();
            base.chart.type = 'line';
            const g = new ApexCharts(gKap('c-akis'), Object.assign(base, {
              series: [
                { name: 'Kullanıcı', data: k },
                { name: 'Cihaz',     data: c },
                { name: 'Destek',    data: t },
              ],
              xaxis: { categories: etiket, labels: { rotate: 0, hideOverlappingLabels: true } },
              stroke: { curve: 'smooth', width: 2.5 },
              markers: { size: gun <= 7 ? 4 : 0 },
              colors: [G_RENK[0], G_RENK[1], G_RENK[3]],
              legend: { position: 'top', horizontalAlign: 'right' },
            }));
            g.render(); grafikler.push(g);
          }

          if (!gBos('c-kumulatif', v)) {
            const kumK = []; let sumK = 0; k.forEach(function(val) { sumK += val; kumK.push(sumK); });
            const kumC = []; let sumC = 0; c.forEach(function(val) { sumC += val; kumC.push(sumC); });
            const base2 = gGrafikTemel();
            base2.chart.type = 'area';
            const g2 = new ApexCharts(gKap('c-kumulatif'), Object.assign(base2, {
              series: [
                { name: 'Kullanıcı (Kümülatif)', data: kumK },
                { name: 'Cihaz (Kümülatif)',     data: kumC }
              ],
              xaxis: { categories: etiket, labels: { rotate: 0, hideOverlappingLabels: true } },
              stroke: { curve: 'smooth', width: 2.5 },
              fill: { type: 'gradient', gradient: { opacityFrom: .28, opacityTo: .02 } },
              markers: { size: gun <= 7 ? 4 : 0 },
              colors: [G_RENK[0], G_RENK[1]],
              legend: { position: 'top', horizontalAlign: 'right' },
            }));
            g2.render(); grafikler.push(g2);
          }

          mini('c-k', k, etiket, G_RENK[0]);
          mini('c-c', c, etiket, G_RENK[1]);
          mini('c-t', t, etiket, G_RENK[3]);
        } catch (e) { gError(e.message); }
      }

      if (garanminGuardPage()) {
        garanminShell('garanmin-akis.html', 'Zaman Akışı', 'Genel');
        yukle();
      }
    </script>
  </body>
</html>
