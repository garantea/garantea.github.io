<!doctype html>
<!--
  GARANMIN — Gelir Gider / Kredi Ekonomisi.

  ══════════════════════════════════════════════════════════════════════════
  ⚠️  BU SAYFA CIRO GOSTERMIYOR — GOSTEREMEZ.
  ══════════════════════════════════════════════════════════════════════════

  Veritabanında para yok: yalnizca kredi bakiyeleri var. Satin alma kayitlari
  RevenueCat tarafinda tutuluyor ve buraya akmiyor. Dolayisiyla bu sayfa
  "ne kadar kazandik" sorusunu DEGIL, "kredi ekonomisi nasil donuyor" sorusunu
  cevapliyor.

  Bunu acikca yazmak onemli: "Gelir" baslikli bir sayfadaki sayilarin gercek ciro
  sanilmasi, yanlis bir is kararinin en kolay yolu. Gercek ciro icin RevenueCat
  webhook'unun bir tabloya yazmasi gerekir; o kurulunca bu sayfa gercek rakamlari
  gosterecek sekilde genisletilebilir.

  HARCANAN KREDI = CIHAZ SAYISI: uygulama cihaz basina 1 kredi dusuyor ve ayri
  bir defter tutulmuyor. Hesap degisirse buradaki varsayim da degismeli.
-->
<html lang="tr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Garanmin — Kredi Ekonomisi</title>
    <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="assets/adminator/adminator.css" />
    <link rel="stylesheet" href="assets/css/garanmin.css" />
  </head>

  <body>
    <div class="shell" id="g-app">
      <aside class="d-sidebar" id="garanmin-menu"></aside>

      <div class="main">
        <header class="d-topbar" id="garanmin-navbar"></header>

        <main class="content">
          <div id="garanmin-error"></div>

          <div class="g-uyari warning" id="uyari"></div>

          <div class="grid">
            <div class="col-3" style="display: flex; flex-direction: column; gap: 14px; min-height: 0;">
              <!-- KPI kutulari dikey olarak ust uste binecek -->
              <div class="kpi-grid" id="serit" style="flex-direction: column; margin-bottom: 0;"></div>
              
              <section class="card" style="flex: 1; min-height: 0;">
                <div class="card-head">
                  <div class="card-title-wrap">
                    <span class="eyebrow">Defter</span>
                    <h2 class="card-title">Kredi akisi</h2>
                  </div>
                </div>
                <div id="akis"></div>
              </section>
            </div>

            <section class="card col-9">
              <div class="card-head">
                <div class="card-title-wrap">
                  <span class="eyebrow">Tüm Kullanıcılar</span>
                  <h2 class="card-title">Kredi Gecmisi ve Hareketler</h2>
                </div>
              </div>
              <div class="g-tablo-kutu-esnek">
                <table class="table">
                  <colgroup>
                    <col style="width:40%"><col style="width:20%">
                    <col style="width:20%"><col style="width:20%">
                  </colgroup>
                  <thead>
                    <tr>
                      <th>E-posta</th>
                      <th class="sayi">Bakiye</th>
                      <th class="sayi">Kazanilan (Reklam)</th>
                      <th class="sayi">Harcanan (Cihaz)</th>
                    </tr>
                  </thead>
                  <tbody id="top"><tr><td colspan="4" class="soluk">Yukleniyor...</td></tr></tbody>
                </table>
              </div>
            </section>
          </div>

          <div class="grid" style="margin-top: 14px;">
            <section class="card col-4">
              <div class="card-head">
                <div class="card-title-wrap">
                  <span class="eyebrow">Kullanıcı basina</span>
                  <h2 class="card-title">Kredi dagilimi</h2>
                </div>
              </div>
              <div class="g-grafik-wrap">
                <div class="g-grafik kisa" id="c-dagilim"></div>
              </div>
            </section>

            <section class="card col-4">
              <div class="card-head">
                <div class="card-title-wrap">
                  <span class="eyebrow">Dagilim</span>
                  <h2 class="card-title">Kullanıcı dagilimi</h2>
                </div>
              </div>
              <div class="g-grafik-wrap">
                <div class="g-grafik kisa" id="c-kullanici"></div>
              </div>
            </section>

            <section class="card col-4">
              <div class="card-head">
                <div class="card-title-wrap">
                  <span class="eyebrow">Odullu</span>
                  <h2 class="card-title">Reklam</h2>
                </div>
              </div>
              <div id="reklam"></div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script src="assets/vendor/libs/apex-charts/apexcharts.js"></script>
    <script src="assets/js/garanmin-api.js"></script>
    <script>
      document.getElementById('uyari').innerHTML = gIkon('info')
        + '<span>Bu sayfa ciro degil, KREDI HAREKETI gosteriyor. Odemeler RevenueCat '
        + 'tarafinda tutuluyor ve veritabanına akmiyor.</span>';

      async function yukle() {
        try {
          const [e, top] = await Promise.all([
            garanminData('garanmin_ekonomi'),
            garanminData('garanmin_users_list', { p_limit: 100, p_offset: 0, p_search: '' }),
          ]);

          const dagitilan = Number(e.mevcut_kredi) + Number(e.harcanan_kredi);

          gKpiYaz('serit', [
            { etiket: 'Dolasimda kredi',      deger: gNum(e.mevcut_kredi),    ikon: 'star',  renk: 'warning' },
            { etiket: 'Harcanan kredi',       deger: gNum(e.harcanan_kredi),  ikon: 'minus', renk: 'danger' },
            { etiket: 'Reklamla kazanilan',   deger: gNum(e.reklam_kredi),    ikon: 'tv',    renk: 'success' },
            { etiket: 'Kullanıcı basina ort.',deger: gNum(e.ortalama_kredi),  ikon: 'calc',  renk: 'primary' },
          ]);

          if (!gBos('c-dagilim', e.dagilim)) {
            const t = gGrafikTemel(); t.chart.type = 'bar';
            new ApexCharts(gKap('c-dagilim'), Object.assign(t, {
              series: [{ name: 'Kullanıcı', data: e.dagilim.map(function (d) { return Number(d.count); }) }],
              xaxis: { categories: e.dagilim.map(function (d) { return d.bucket; }) },
              plotOptions: { bar: { borderRadius: 5, distributed: true, columnWidth: '55%' } },
              legend: { show: false },
            })).render();
          }

          document.getElementById('top').innerHTML = (top && top.length)
            ? top.map(function (u) {
                const kazanilan = u.ad_watch_count ? Math.floor(Number(u.ad_watch_count) / 5) : 0;
                return '<tr style="cursor:pointer" onclick="location.href=\'garanmin-users.html?arama=\' + encodeURIComponent(gEsc(u.email))">'
                  + '<td title="' + gEsc(u.email) + '">' + gEsc(u.email) + '</td>'
                  + '<td class="sayi">' + gNum(u.credits) + '</td>'
                  + '<td class="sayi"><span class="badge success">+' + gNum(kazanilan) + ' kr</span> <span class="soluk" style="font-size:10px">(' + gNum(u.ad_watch_count) + ' rklm)</span></td>'
                  + '<td class="sayi"><span class="badge danger">-' + gNum(u.device_count) + ' kr</span> <span class="soluk" style="font-size:10px">(' + gNum(u.device_count) + ' chz)</span></td>'
                  + '</tr>';
              }).join('')
            : '<tr><td colspan="4" class="soluk">Kayit yok</td></tr>';

          document.getElementById('akis').innerHTML =
            gKv('Dagitilan toplam', gNum(dagitilan), 'dolasimda + harcanan')
            + gKv('Harcanan', gNum(e.harcanan_kredi), 'cihaz basina 1 kredi')
            + gKv('Dolasimda kalan', gNum(e.mevcut_kredi))
            + gKv('Kullanim orani',
                dagitilan ? '%' + Math.round(Number(e.harcanan_kredi) / dagitilan * 100) : '-');

          const toplamK = Number(e.kredili_kullanici) + Number(e.kredisiz_kullanici);

          document.getElementById('reklam').innerHTML =
            gKv('Toplam izlenme', gNum(e.reklam_izlenme))
            + gKv('Kazandirdigi kredi', gNum(e.reklam_kredi), '5 reklam = 1 kredi')
            + gKv('Izlenme / kullanici',
                gNum((Number(e.reklam_izlenme) / Math.max(1, toplamK)).toFixed(1)));

          /* Hic kullanici yoksa halka CIZILMIYOR: iki dilimi de sifir olan bir
             halka, "veri gelmedi" ile "deger sifir" arasindaki farki gizliyor. */
          if (toplamK === 0) { gBos('c-kullanici', null); return; }

          const t2 = gGrafikTemel(); t2.chart.type = 'donut';
          new ApexCharts(gKap('c-kullanici'), Object.assign(t2, {
            series: [Number(e.kredili_kullanici), Number(e.kredisiz_kullanici)],
            labels: ['Kredisi olan', 'Kredisi biten'],
            colors: [G_RENK[1], G_RENK[6]],
            legend: { position: 'bottom', fontSize: '11.5px' },
            plotOptions: { pie: { donut: { size: '60%' } } },
          })).render();
        } catch (err) { gError(err.message); }
      }

      if (garanminGuardPage()) {
        garanminShell('garanmin-ekonomi.html', 'Kredi Ekonomisi', 'Gelir Gider');
        yukle();
      }
    </script>
  </body>
</html>
